# 每个子目录一个镜像站的端到端测试；docker compose run --rm <服务名> 即测相应镜像。
# MIRROR_HOST / PKG 均为运行时变量（默认测试生产域名的 HTTP 服务）。
services:
  homebrew:
    build: ./homebrew
    environment:
      MIRROR_HOST: ${MIRROR_HOST:-mirrors.zju.edu.cn}
      PKG: ${PKG:-}
    restart: "no"
  debian:
    build: ./debian
    environment:
      MIRROR_HOST: ${MIRROR_HOST:-mirrors.zju.edu.cn}
      PKG: ${PKG:-}
    restart: "no"
