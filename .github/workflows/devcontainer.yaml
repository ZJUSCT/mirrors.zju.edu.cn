name: Build K8s dev container

on:
  push:
    branches: [main]
    paths:
      - 'containers/devcontainer/**'
      - '.github/workflows/devcontainer.yaml'
  pull_request:
    paths:
      - 'containers/devcontainer/**'
      - '.github/workflows/devcontainer.yaml'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: devcontainer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.arch }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/devcontainer" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build dev container with Features
        uses: devcontainers/ci@v0.3
        with:
          configFile: containers/devcontainer/devcontainer.json
          imageName: ${{ env.IMAGE }}
          imageTag: ${{ github.sha }}-${{ matrix.arch }}
          platform: linux/${{ matrix.arch }}
          cacheFrom: ${{ env.IMAGE }}:latest
          push: ${{ github.event_name != 'pull_request' && 'always' || 'never' }}

  manifest:
    name: Publish multi-platform image
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/devcontainer"
          docker buildx imagetools create \
            --tag "$image:latest" \
            --tag "$image:${GITHUB_SHA:0:7}" \
            "$image:$GITHUB_SHA-amd64" \
            "$image:$GITHUB_SHA-arm64"
