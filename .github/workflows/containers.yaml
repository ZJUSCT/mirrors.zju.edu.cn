name: Build container images

on:
  push:
    branches: [main]
    paths:
      - 'containers/**'
      - '.github/workflows/containers.yaml'
  pull_request:
    paths:
      - 'containers/**'
      - '.github/workflows/containers.yaml'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  changes:
    name: Detect changed container images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      images: ${{ steps.matrix.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect changed container folders
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            git-http-backend:
              - 'containers/git-http-backend/**'
            archvsync:
              - 'containers/archvsync/**'
            anaconda:
              - 'containers/anaconda/**'
            quick-fedora-mirror:
              - 'containers/quick-fedora-mirror/**'
            rsync:
              - 'containers/rsync/**'
            tsumugu:
              - 'containers/tsumugu/**'
            workflow:
              - '.github/workflows/containers.yaml'
      - name: Build the selected matrix
        id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANGED_IMAGES: ${{ steps.filter.outputs.changes }}
          WORKFLOW_CHANGED: ${{ steps.filter.outputs.workflow }}
        run: |
          set -eu

          if [ "$EVENT_NAME" = schedule ] || [ "$EVENT_NAME" = workflow_dispatch ] || [ "$WORKFLOW_CHANGED" = true ]; then
              images='["git-http-backend","archvsync","anaconda","quick-fedora-mirror","rsync","tsumugu"]'
          else
              images="$CHANGED_IMAGES"
          fi

          echo "images=$images" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.image }}
    needs: changes
    if: needs.changes.outputs.images != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    concurrency:
      group: containers-${{ matrix.image }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Image and tag name
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: containers/${{ matrix.image }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          pull: true
          no-cache: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.SHORT_SHA }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=containers-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=containers-${{ matrix.image }}
          provenance: false
      - name: Clean up old image versions
        if: github.event_name != 'pull_request'
        uses: dataaxiom/ghcr-cleanup-action@v1.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          owner: ${{ github.repository_owner }}
          package: ${{ matrix.image }}
          keep-n-tagged: 1
          delete-untagged: true
