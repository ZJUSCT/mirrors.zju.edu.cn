apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: mirror-timeouts
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: envoy-gateway-staging
  timeout:
    http:
      requestTimeout: 10m
      maxStreamDuration: 0s
      connectionIdleTimeout: 60s
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: mirror-staging
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-gateway-staging
  clientIPDetection:
    directSourceIP: {}
  connection:
    connectionLimit:
      maxStreamDuration: 10m
  timeout:
    http:
      streamIdleTimeout: 60s
