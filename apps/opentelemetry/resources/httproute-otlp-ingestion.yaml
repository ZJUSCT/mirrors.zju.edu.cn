apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: otlp-ingestion
spec:
  parentRefs:
    - name: envoy-gateway-production
      namespace: mirror-production
      sectionName: https-mirrors
  hostnames:
    - mirrors.zju.edu.cn
  rules:
    - matches:
        - method: POST
          path:
            type: PathPrefix
            value: /otel
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: aggregator-collector
          port: 4319
      timeouts:
        request: 30s
        backendRequest: 25s
