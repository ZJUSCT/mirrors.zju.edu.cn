apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: aggregator
spec:
  mode: deployment
  replicas: 2
  env:
    - name: CLICKHOUSE_PASSWORD
      valueFrom:
        secretKeyRef:
          name: clickhouse-otelcollector
          key: password
  resources:
    requests:
      cpu: 500m
      memory: 256Mi
    limits:
      cpu: '2'
      memory: 1Gi
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25
      k8sattributes:
        passthrough: false
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: connection
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.node.name
            - k8s.deployment.name
            - k8s.daemonset.name
            - k8s.statefulset.name
            - k8s.container.name
            - container.image.name
            - container.image.tag
            - service.namespace
            - service.name
            - service.version
            - service.instance.id
      batch:
        send_batch_size: 1024
        send_batch_max_size: 2048
        timeout: 5s
    exporters:
      otlphttp/prometheus:
        endpoint: http://kube-prometheus-stack-prometheus.kube-prometheus-stack.svc:9090/api/v1/otlp
      otlp/tempo:
        endpoint: tempo-distributor.kube-prometheus-stack.svc:4317
        tls:
          insecure: true
      clickhouse:
        endpoint: tcp://clickhouse.clickhouse.svc:9000?dial_timeout=10s
        username: otelcollector
        password: ${env:CLICKHOUSE_PASSWORD}
        database: otel
        logs_table_name: otel_logs
        create_schema: true
        ttl: 4320h # 180 天
        async_insert: true
        timeout: 30s
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
        sending_queue:
          enabled: true
          queue_size: 1000
          num_consumers: 4
    service:
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [otlphttp/prometheus]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [otlp/tempo]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [clickhouse]
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
                    without_scope_info: false
                    without_type_suffix: false
                    without_units: false
