apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: gateway
spec:
  mode: deployment
  replicas: 2
  env:
    - name: CLICKHOUSE_PASSWORD
      valueFrom:
        secretKeyRef:
          name: clickhouse-otelcollector
          key: password
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: '2'
      memory: 1Gi
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25
      # 处理两个网关（mirror-production / envoy-gateway-staging）上报的 access log。
      # 网关 CR 的 resourceAttributes 已自带身份信息，因此本 collector 不做 k8sattributes。
      transform/accesslog:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              # Envoy 在请求结束时才发送 access log，但 OTLP Timestamp 固定为请求开始时间。
              # 镜像大文件下载可能持续一小时以上；保留请求开始时间供后续 ClickHouse 分析，
              # 同时以 collector 收到记录的时间作为日志事件时间。
              - set(attributes["request_start_time_unix_nano"], time_unix_nano)
              - set(observed_time, Now())
              - set(time, observed_time)
              # EG 的 format token 产出均为字符串；转换失败（例如 upstream_service_time 为 "-"）时
              # 该语句被跳过，原值保留，后续 severity 语句因类型不符同样跳过、回落 INFO。
              - set(attributes["response_code"], Int(attributes["response_code"]))
              - set(attributes["bytes_received"], Int(attributes["bytes_received"]))
              - set(attributes["bytes_sent"], Int(attributes["bytes_sent"]))
              - set(attributes["duration_ms"], Int(attributes["duration_ms"]))
              - set(attributes["response_duration_ms"], Int(attributes["response_duration_ms"]))
              - set(attributes["upstream_service_time"], Double(attributes["upstream_service_time"])) where attributes["upstream_service_time"] != "-"
              # Envoy 的 OTLP logger 不设置 severity；按响应码派生标准日志级别。
              # code=0 表示响应开始前连接即失败（response_flags UF/UH 等），与 5xx 同级。
              - set(severity_number, SEVERITY_NUMBER_INFO)
              - set(severity_text, "INFO")
              - set(severity_number, SEVERITY_NUMBER_WARN) where Int(attributes["response_code"]) >= 400 and Int(attributes["response_code"]) < 500
              - set(severity_text, "WARN") where Int(attributes["response_code"]) >= 400 and Int(attributes["response_code"]) < 500
              - set(severity_number, SEVERITY_NUMBER_ERROR) where Int(attributes["response_code"]) >= 500 or Int(attributes["response_code"]) == 0
              - set(severity_text, "ERROR") where Int(attributes["response_code"]) >= 500 or Int(attributes["response_code"]) == 0
              # EG 恒定向 attributes 追加 k8s.namespace.name / k8s.pod.name；前者与 sink 的
              # resourceAttributes 重复，因此删除 attributes 中的冗余副本。
              - delete_key(attributes, "k8s.namespace.name")
      batch:
        send_batch_size: 1024
        send_batch_max_size: 2048
        timeout: 5s
    exporters:
      clickhouse:
        endpoint: tcp://clickhouse.clickhouse.svc:9000?dial_timeout=10s
        username: otelcollector
        password: ${env:CLICKHOUSE_PASSWORD}
        database: otel
        logs_table_name: otel_logs
        create_schema: true
        ttl: 4320h # 180 天
        async_insert: true
        timeout: 30s
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
        sending_queue:
          enabled: true
          queue_size: 1000
          num_consumers: 4
      otlp/tempo:
        endpoint: tempo-distributor.kube-prometheus-stack.svc:4317
        tls:
          insecure: true
    service:
      pipelines:
        logs:
          receivers: [otlp]
          processors: [memory_limiter, transform/accesslog, batch]
          exporters: [clickhouse]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/tempo]
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
                    without_scope_info: false
                    without_type_suffix: false
                    without_units: false
