apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: opentelemetry
resources:
  - resources/namespace.yaml
  - resources/sealedsecret-clickhouse-otelcollector.yaml
  - resources/otelcol-aggregator.yaml
  - resources/otelcol-gateway.yaml
  - resources/otelcol-node-logs.yaml
  - resources/podmonitor-collectors.yaml
helmCharts:
  - name: opentelemetry-operator
    repo: https://open-telemetry.github.io/opentelemetry-helm-charts
    includeCRDs: true
    releaseName: opentelemetry-operator
    namespace: opentelemetry
    valuesFile: values/opentelemetry-operator-0.126.2.yaml
    version: 0.126.2
