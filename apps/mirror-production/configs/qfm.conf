# quick-fedora-mirror 原生只读取 zsh 配置文件。QFM_* 是本站适配层：
# 由各 Mirror 的 podTemplate 环境变量注入，再在此显式导入。
DESTD='/data'
TIMEFILE='/data/.qfm-timefile'

REMOTE="${QFM_REMOTE:?QFM_REMOTE must be set}"
MASTERMODULE='fedora-buffet'
MODULES=("${QFM_MODULE:?QFM_MODULE must be set}")

LOGFILE='/dev/stdout'
VERBOSE=5

# Falcon 通过快照提供发布原子性，因此不使用 --delay-updates；这样被
# timeout 终止的同步仍可在下一轮利用已下载内容继续收敛。
RSYNCOPTS=(
    -aSH
    -f 'R .~tmp~'
    --stats
    --out-format='@ %i %10l  %n%L'
    "${QFM_RSYNC_FAMILY:--6}"
)
