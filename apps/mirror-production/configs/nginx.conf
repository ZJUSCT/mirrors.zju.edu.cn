# Nginx 默认配置 worker_processes auto 使 worker 数等于 CPU 核数
# 与 resource limit 相比显著过大，导致更多的内存占用和调度开销
worker_processes  2;

error_log  /var/log/nginx/error.log notice;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;

    proxy_cache_path /tmp/listing-cache levels=1:2 keys_zone=listings:8m
                     max_size=512m inactive=365d use_temp_path=off;

    # 目录只在第一次 API 请求时生成，保留到 Pod 被替换或缓存容量淘汰。
    # 设置长有效期避免按天重扫冷目录；此配置不向客户端宣告长期缓存。
    # 大目录仍返回完整 JSON，压缩减少传输量，不改变缓存中的原始表示。
    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;

    # 入口：缓存完整的目录 JSON，文件仍直接从文件系统提供。
    server {
        listen 8080 default_server sndbuf=256k;
        listen [::]:8080 default_server sndbuf=256k;
        server_name _;

        root /usr/share/nginx/html;
        charset utf-8;

        add_header X-Content-Type-Options "nosniff" always;

        # 普通目录始终返回浏览页面，目录数据仅由 .mirror-index API 提供。
        # 绝对路径 index 触发内部跳转，浏览器的地址仍为原目录。
        index /autoindex/index.html;

        # 目录补斜杠使用相对重定向，避免向公网泄漏容器端口。
        absolute_redirect off;
        log_not_found off;

        # 容器健康检查
        location = /healthz {
            access_log off;
            return 204;
        }

        # 页面过大，不放入 ConfigMap。前端 Service 不可用时 HTML 返回 502，
        # JSON 与文件下载不依赖前端 Service。
        location = /autoindex/index.html {
            proxy_pass http://mirror-front:8080;
        }

        # API 留在镜像自身前缀下，复用 Falcon 的现有 HTTPRoute。
        # /debian/.mirror-index/pool/ 对应只读卷中的 /debian/pool/。
        # 此 location 必须放在各镜像的正则 location 之前，避免被其截获。
        location ~ ^/[^/]+/\.mirror-index/ {
            # API 只列举以 / 结尾的目录，不提供文件下载。
            if ($uri !~ /$) {
                return 404;
            }
            rewrite ^/([^/]+)/\.mirror-index(/.*)$ /$1$2 break;

            # 正则 location 使用不带 URI 的 proxy_pass，转发重写后的路径。
            # 生成端只提供 JSON，不进行内容协商，也不会再跳回页面入口。
            proxy_pass http://127.0.0.1:8081;
            proxy_set_header Accept-Encoding "";

            # 当前目录 JSON 不使用查询参数；key 区分完整目录路径和格式。
            # 快照隔离由 Pod 私有 emptyDir 保证，不可改为跨 Pod 共享缓存。
            proxy_cache listings;
            proxy_cache_key "$uri|json-v1";
            proxy_cache_valid 200 365d;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 120s;
            proxy_cache_lock_age 120s;
            proxy_read_timeout 120s;
            # 客户端提前超时仍完成缓存填充，避免下一次请求重新扫描。
            proxy_ignore_client_abort on;

            # 此处定义 add_header 后不再继承 server 的安全头，需显式保留。
            # 内部缓存的有效期不转成公网 Cache-Control；公开 URL 会随快照更新。
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Listing-Cache $upstream_cache_status always;
        }

        # 保留各镜像的专用服务规则（OCI 重写、git smart HTTP 等）。
        include /etc/nginx/locations/*.conf;

        location ^~ /debian/project/trace/ {
            index .no-index;
            autoindex on;
            autoindex_format html;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }

    # 生成端：只有本 Pod 可以连接，每次收到 GET 仍会扫描目录。
    server {
        listen 127.0.0.1:8081;
        server_name _;
        # 仅入口按客户端能力压缩，生成端保持单一表示，避免拆成多个缓存变体。
        gzip off;
        root /usr/share/nginx/html;
        charset utf-8;
        absolute_redirect off;
        # 不选取镜像自带的 index.html，也不进入前端壳页的内部跳转。
        index .no-index;
        autoindex on;
        autoindex_format json;
        # 即便客户端构造文件路径，也只能通过 API 查询真实存在的目录。
        location / {
            try_files $uri/ =404;
        }
        log_not_found off;
        # 公网请求由入口记录一次，避免内部扫描产生重复 access log。
        access_log off;
    }
}
