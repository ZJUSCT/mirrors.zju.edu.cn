# 由 mirrors/packaging-gitea-act-runner.yaml 迁入：GitLab Pages 无目录列表（404），
# 改用 ustcmirror/apt-sync 直接按 APT Release/Packages 从官方上游同步。
apiVersion: mirrors.zjusct.io/v1alpha1
kind: Mirror
metadata:
  name: packaging-gitea-act-runner
  namespace: mirror-production
  labels:
    app.kubernetes.io/name: falcon
spec:
  info:
    description: 社区维护的 Gitea Actions Runner Debian 软件包仓库
    upstream: https://packaging.gitlab.io/gitea-act-runner/
  sync:
    interval: 6h
    retryInterval: 15m
    timeout: 24h
    failureRetryLimit: 3
    keepJobs: 1
    podTemplate:
      spec:
        nodeSelector:
          kubernetes.io/hostname: s1.mirrors.zjusct.io
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          seccompProfile:
            type: RuntimeDefault
        initContainers:
          - name: init-sync-volume
            image: busybox:1.37
            imagePullPolicy: Always
            command: [sh, /init/init-sync-volume.sh]
            env:
              - name: SYNC_UID
                value: "65532"
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
                add: [CHOWN]
            volumeMounts:
              - name: sync-data
                mountPath: /data
              - name: sync-volume-init
                mountPath: /init
                readOnly: true
            resources:
              requests: {cpu: 10m, memory: 16Mi}
              limits: {cpu: 100m, memory: 32Mi}
        containers:
          - name: apt-sync
            image: ustcmirror/apt-sync:latest
            imagePullPolicy: Always
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
              readOnlyRootFilesystem: true
            command: [python3, /sync.py]
            env:
              - name: HOME
                value: /tmp
              - name: TO
                value: /data/
              - name: APTSYNC_URL
                value: https://packaging.gitlab.io/gitea-act-runner
              - name: APTSYNC_UNLINK
                value: "1"
              - name: APTSYNC_DISTS
                value: gitea-act-runner|main|amd64 arm64|
            volumeMounts:
              - name: sync-data
                mountPath: /data
              - name: tmp
                mountPath: /tmp
            resources:
              requests: {cpu: 500m, memory: 512Mi}
              limits: {cpu: "4", memory: 4Gi}
        volumes:
          - name: sync-volume-init
            configMap:
              name: sync-volume-init
          - name: tmp
            emptyDir: {}
  storage:
    syncStorageClassName: zfs-hdd-retain-wffc
    publishStorageClassName: zfs-hdd-delete-immediate
    pvcTemplate:
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 4Gi
      volumeMode: Filesystem
    volumeSnapshotClassName: openebs-zfs-snapshot
    retention: 1
  publish:
    http:
      replicas: 1
      podTemplate:
        metadata:
          annotations:
            reloader.stakater.com/auto: "true"
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: nginx
              image: registry.mirrors.zjusct.io/docker.io/nginx/nginx-unprivileged:mainline-otel
              imagePullPolicy: Always
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
                readOnlyRootFilesystem: true
              ports:
                - containerPort: 8080
                  name: http
              startupProbe:
                httpGet:
                  path: /healthz
                  port: http
                periodSeconds: 2
                timeoutSeconds: 2
                failureThreshold: 30
              readinessProbe:
                httpGet:
                  path: /healthz
                  port: http
                periodSeconds: 5
                timeoutSeconds: 2
                failureThreshold: 3
              livenessProbe:
                httpGet:
                  path: /healthz
                  port: http
                periodSeconds: 10
                timeoutSeconds: 2
                failureThreshold: 6
              resources:
                requests: {cpu: "10m", memory: 32Mi}
                limits: {cpu: "4", memory: 256Mi}
              volumeMounts:
                - name: nginx-conf
                  mountPath: /etc/nginx/nginx.conf
                  subPath: nginx.conf
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
                - name: mirror-data
                  mountPath: /usr/share/nginx/html/packaging-gitea-act-runner
                  readOnly: true
          volumes:
            - name: nginx-conf
              configMap:
                name: nginx-conf
            - name: tmp
              emptyDir:
                sizeLimit: 1Gi
