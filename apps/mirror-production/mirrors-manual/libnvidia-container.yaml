# 官方来源（2026-10-31 复核）：
# - https://github.com/NVIDIA/libnvidia-container/tree/gh-pages
# - https://nvidia.github.io/libnvidia-container/
# - https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/install-guide.html
# - https://mirrors.ustc.edu.cn/help/libnvidia-container.html
# gh-pages 是 APT/RPM 软件包发布工作树；直接检出，无需构建 Jekyll。
# 保留 stable/experimental、旧发行版及全部架构，Git 原样维护内部符号链接。
# .list/.repo 保留官方 URL，客户端按本站路径改源；不改写签名元数据或软件包。
# 复用 USTC rsync 种子中的 .git，后续 fetch/reset 直接访问 NVIDIA GitHub。
# .git 仅供同步使用，HTTP 禁止访问。首次空卷由 gitsync 执行 treeless clone。
# 6h 为本站同步间隔，未查到官方规定的固定间隔。
apiVersion: mirrors.zjusct.io/v1alpha1
kind: Mirror
metadata:
  name: libnvidia-container
  namespace: mirror-production
  labels:
    app.kubernetes.io/name: falcon
spec:
  info:
    description: NVIDIA Container Toolkit 的 APT/RPM 软件包仓库
    upstream: https://github.com/NVIDIA/libnvidia-container.git
  sync:
    interval: 6h
    retryInterval: 15m
    timeout: 24h
    failureRetryLimit: 3
    keepJobs: 1
    podTemplate:
      spec:
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          seccompProfile:
            type: RuntimeDefault
        initContainers:
          # 只初始化同步卷根目录的 owner；QFM 使用独立的同步 UID。
          - name: init-sync-volume
            image: busybox:1.37
            imagePullPolicy: Always
            command: [sh, /init/init-sync-volume.sh]
            env:
              - name: SYNC_UID
                value: "65532"
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
                add: [CHOWN]
            volumeMounts:
              - name: sync-data
                mountPath: /data
              - name: sync-volume-init
                mountPath: /init
                readOnly: true
            resources:
              requests: {cpu: 10m, memory: 16Mi}
              limits: {cpu: 100m, memory: 32Mi}
        containers:
          - name: gitsync
            image: ustcmirror/gitsync:latest
            imagePullPolicy: Always
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
              readOnlyRootFilesystem: true
            # 跳过需要 root 的 entry.sh，直接以同步 UID 执行 Git 同步。
            command: [/sync.sh]
            env:
              - name: TO
                value: /data/
              - name: GITSYNC_URL
                value: https://github.com/NVIDIA/libnvidia-container.git
              - name: GITSYNC_REMOTE
                value: origin
              - name: GITSYNC_BRANCH
                value: gh-pages:gh-pages
              - name: GITSYNC_CHECKOUT
                value: "true"
              - name: GITSYNC_MIRROR
                value: "false"
              - name: GITSYNC_TREELESS
                value: "true"
              - name: DEBUG
                value: "false"
              - name: HTTP_PROXY
                value: http://sing-box.sing-box.svc.cluster.local:7890
              - name: HTTPS_PROXY
                value: http://sing-box.sing-box.svc.cluster.local:7890
              - name: NO_PROXY
                value: localhost,127.0.0.1,::1,10.0.0.0/8,172.26.0.0/16,172.27.0.0/16,fda8:d4b1:99d0:100::/56,fda8:d4b1:99d0:200::/112,.svc,.cluster.local
            volumeMounts:
              - name: tmp
                mountPath: /tmp
              - name: sync-data
                mountPath: /data
            resources:
              requests: {cpu: 500m, memory: 512Mi}
              limits: {cpu: "4", memory: 4Gi}
        volumes:
          - name: sync-volume-init
            configMap:
              name: sync-volume-init
          - name: tmp
            emptyDir: {}
  storage:
    syncStorageClassName: zfs-hdd-retain-wffc
    publishStorageClassName: zfs-hdd-delete-immediate
    pvcTemplate:
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 16Gi
      volumeMode: Filesystem
    volumeSnapshotClassName: openebs-zfs-snapshot
    retention: 1
  publish:
    http:
      replicas: 1
      podTemplate:
        metadata:
          annotations:
            reloader.stakater.com/auto: "true"
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: nginx
              image: nginxinc/nginx-unprivileged:mainline-alpine-otel
              imagePullPolicy: Always
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
                readOnlyRootFilesystem: true
              ports:
                - containerPort: 8080
                  name: http
              startupProbe:
                httpGet:
                  path: /healthz
                  port: http
                periodSeconds: 2
                timeoutSeconds: 2
                failureThreshold: 30
              readinessProbe:
                httpGet:
                  path: /healthz
                  port: http
                periodSeconds: 5
                timeoutSeconds: 2
                failureThreshold: 3
              livenessProbe:
                httpGet:
                  path: /healthz
                  port: http
                periodSeconds: 10
                timeoutSeconds: 2
                failureThreshold: 6
              resources:
                requests: {cpu: "10m", memory: 32Mi}
                limits: {cpu: "4", memory: 256Mi}
              volumeMounts:
                - name: nginx-conf
                  mountPath: /etc/nginx/nginx.conf
                  subPath: nginx.conf
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
                - name: mirror-data
                  mountPath: /usr/share/nginx/html/libnvidia-container
                  readOnly: true
                - name: nginx-locations
                  mountPath: /etc/nginx/locations
                  readOnly: true
          volumes:
            - name: nginx-conf
              configMap:
                name: nginx-conf
            - name: tmp
              # 目录缓存上限 512Mi，额外空间用于正在填充的响应及其他临时文件。
              emptyDir:
                sizeLimit: 1Gi
            - name: nginx-locations
              configMap:
                name: libnvidia-container-nginx-locations
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: libnvidia-container-nginx-locations
  namespace: mirror-production
  labels:
    app.kubernetes.io/name: falcon
data:
  hide-git.conf: |
    location = /libnvidia-container/.git {
        return 404;
    }
    location ^~ /libnvidia-container/.git/ {
        return 404;
    }
