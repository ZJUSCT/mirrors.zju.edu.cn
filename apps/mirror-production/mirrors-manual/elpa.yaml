# 由 mirrors/elpa.yaml 迁入：ELPA 由 GNU / NonGNU / MELPA 共 6 个官方独立 rsync 子目录组成，
# 且须保留只读历史 /data/org/；因此在一个同步容器内按目录边界分别执行 rsync。
apiVersion: mirrors.zjusct.io/v1alpha1
kind: Mirror
metadata:
  name: elpa
  namespace: mirror-production
  labels:
    app.kubernetes.io/name: falcon
spec:
  info:
    description: Emacs 内建包管理器 package.el 的软件源
    upstream: rsync://elpa.gnu.org/elpa/
  sync:
    interval: 4h
    retryInterval: 15m
    timeout: 24h
    failureRetryLimit: 3
    keepJobs: 1
    podTemplate:
      spec:
        nodeSelector:
          kubernetes.io/hostname: s1.mirrors.zjusct.io
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          seccompProfile:
            type: RuntimeDefault
        initContainers:
          - name: init-sync-volume
            image: busybox:1.37
            imagePullPolicy: Always
            command: [sh, /init/init-sync-volume.sh]
            env:
              - name: SYNC_UID
                value: "65532"
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
                add: [CHOWN]
            volumeMounts:
              - name: sync-data
                mountPath: /data
              - name: sync-volume-init
                mountPath: /init
                readOnly: true
            resources:
              requests: {cpu: 10m, memory: 16Mi}
              limits: {cpu: 100m, memory: 32Mi}
        containers:
          - name: rsync
            image: ghcr.io/zjusct/rsync:latest
            imagePullPolicy: Always
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
              readOnlyRootFilesystem: true
            command: [sh, -c]
            args:
              - |
                set -eu
                sync_one() {
                  sub="$1"; url="$2"; extra="$3"
                  echo "=== syncing /data/$sub from $url ==="
                  mkdir -p "/data/$sub"
                  # shellcheck disable=SC2086
                  rsync -aH $extra --no-o --no-g --stats -h --itemize-changes \
                    --partial-dir=.rsync-partial --filter='P .rsync-partial/' \
                    --exclude=.~tmp~/ --delete --delete-excluded --safe-links \
                    --timeout=120 --contimeout=120 "$url" "/data/$sub/"
                }
                sync_one gnu          rsync://elpa.gnu.org/elpa/           "-6"
                sync_one gnu-devel    rsync://elpa.gnu.org/elpa-devel/     "-6"
                sync_one nongnu       rsync://elpa.nongnu.org/nongnu/      "-6"
                sync_one nongnu-devel rsync://elpa.nongnu.org/nongnu-devel/ "-6"
                sync_one melpa        rsync://melpa.org/packages/          ""
                sync_one stable-melpa rsync://melpa.org/packages-stable/   ""
            volumeMounts:
              - name: tmp
                mountPath: /tmp
              - name: sync-data
                mountPath: /data
            resources:
              requests: {cpu: 500m, memory: 512Mi}
              limits: {cpu: "4", memory: 4Gi}
        volumes:
          - name: sync-volume-init
            configMap:
              name: sync-volume-init
          - name: tmp
            emptyDir: {}
  storage:
    syncStorageClassName: zfs-hdd-retain-wffc
    publishStorageClassName: zfs-hdd-delete-immediate
    pvcTemplate:
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 20Gi
      volumeMode: Filesystem
    volumeSnapshotClassName: openebs-zfs-snapshot
    retention: 1
  publish:
    http:
      replicas: 1
      podTemplate:
        metadata:
          annotations:
            reloader.stakater.com/auto: "true"
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: nginx
              image: registry.mirrors.zjusct.io/docker.io/nginx/nginx-unprivileged:mainline-otel
              imagePullPolicy: Always
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
                readOnlyRootFilesystem: true
              ports:
                - containerPort: 8080
                  name: http
              startupProbe:
                httpGet:
                  path: /healthz
                  port: http
                periodSeconds: 2
                timeoutSeconds: 2
                failureThreshold: 30
              readinessProbe:
                httpGet:
                  path: /healthz
                  port: http
                periodSeconds: 5
                timeoutSeconds: 2
                failureThreshold: 3
              livenessProbe:
                httpGet:
                  path: /healthz
                  port: http
                periodSeconds: 10
                timeoutSeconds: 2
                failureThreshold: 6
              resources:
                requests: {cpu: "10m", memory: 32Mi}
                limits: {cpu: "4", memory: 256Mi}
              volumeMounts:
                - name: nginx-conf
                  mountPath: /etc/nginx/nginx.conf
                  subPath: nginx.conf
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
                - name: mirror-data
                  mountPath: /usr/share/nginx/html/elpa
                  readOnly: true
          volumes:
            - name: nginx-conf
              configMap:
                name: nginx-conf
            - name: tmp
              # 目录缓存上限 512Mi，额外空间用于正在填充的响应及其他临时文件。
              emptyDir:
                sizeLimit: 1Gi
