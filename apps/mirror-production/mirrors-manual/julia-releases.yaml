# comment:
#   official:
#     surveyed_at: '2026-11-21'
#     docs:
#       - https://julialang.org/downloads/manual-downloads/
#       - https://julialang-s3.julialang.org/
#     policy:
#       - 发布 bin/、juliaup/、src/ 等全部对象，保留历史发行、校验和与 .asc 签名。
#       - 官方存储桶为 AWS S3 us-east-1 的公开桶 s3://julialang2/（前端同时通过 https://julialang-s3.julialang.org/ 提供 Fastly CDN）。
#       - 必须开启 --exact-timestamps（参考 TUNA issues#1593），否则 juliaup/RELEASECHANNELVERSION 等同体积更新文件不会被同步。
#       - 参考 SJTUG 生产配置，排除 *DO_NOT_UPLOAD_HERE 与 bin/mac/extras/cctools_bundle.tar.gz（规避桶内无权限/占位对象导致 sync 失败）。
#       - tsumugu 的 s3-indexbuilder 仅解析 HTML 索引，无法分页读取 S3 XML，因此迁入 mirrors-manual/ 使用 amazon/aws-cli 同步。
#       - 4h 为本地同步周期，与官方持续发布及 SJTUG 高频增量同步需求匹配。
#   upstreams:
#     - url: s3://julialang2/
#       stack: dual
#       surveyed_at: '2026-11-21'
#       note: 官方 AWS S3 us-east-1 公开桶（开启 AWS_USE_DUALSTACK_ENDPOINT=true）。2026-11-21 在 s1 使用 amazon/aws-cli --dryrun 对现有 PVC 校验耗时 24.56s，精准检出 20 个更新文件，0 删除。
apiVersion: mirrors.zjusct.io/v1alpha1
kind: Mirror
metadata:
  name: julia-releases
  namespace: mirror-production
  labels:
    app.kubernetes.io/name: falcon
spec:
  info:
    description: Julia 二进制程序镜像
    upstream: https://julialang-s3.julialang.org/
  sync:
    interval: 4h
    retryInterval: 15m
    timeout: 24h
    failureRetryLimit: 3
    keepJobs: 1
    podTemplate:
      spec:
        # 仅用于 WaitForFirstConsumer PVC 的首次落盘；PV 绑定后应从清单移除
        nodeSelector:
          kubernetes.io/hostname: s1.mirrors.zjusct.io
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          seccompProfile:
            type: RuntimeDefault
        initContainers:
          # 只初始化同步卷根目录的 owner；QFM 使用独立的同步 UID。
          - name: init-sync-volume
            image: busybox:1.37
            imagePullPolicy: Always
            command: [sh, /init/init-sync-volume.sh]
            env:
              - name: SYNC_UID
                value: "65532"
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
                add: [CHOWN]
            volumeMounts:
              - name: sync-data
                mountPath: /data
              - name: sync-volume-init
                mountPath: /init
                readOnly: true
            resources:
              requests: {cpu: 10m, memory: 16Mi}
              limits: {cpu: 100m, memory: 32Mi}
        containers:
          - name: aws-cli
            image: registry.mirrors.zjusct.io/docker.io/amazon/aws-cli:latest
            imagePullPolicy: Always
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
              readOnlyRootFilesystem: true
            command: [aws]
            args:
              - s3
              - sync
              - --exact-timestamps
              - --no-sign-request
              - --no-progress
              - s3://julialang2/
              - /data/
              - --exclude
              - "*DO_NOT_UPLOAD_HERE"
              - --exclude
              - bin/mac/extras/cctools_bundle.tar.gz
              - --delete
            env:
              - name: HOME
                value: /tmp
              - name: AWS_EC2_METADATA_DISABLED
                value: "true"
              - name: AWS_USE_DUALSTACK_ENDPOINT
                value: "true"
              - name: AWS_DEFAULT_REGION
                value: us-east-1
            volumeMounts:
              - name: tmp
                mountPath: /tmp
              - name: sync-data
                mountPath: /data
            resources:
              requests: {cpu: 500m, memory: 512Mi}
              limits: {cpu: "4", memory: 4Gi}
        volumes:
          - name: sync-volume-init
            configMap:
              name: sync-volume-init
          - name: tmp
            emptyDir: {}
  storage:
    syncStorageClassName: zfs-hdd-retain-wffc
    publishStorageClassName: zfs-hdd-delete-immediate
    pvcTemplate:
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 812Gi
      volumeMode: Filesystem
    volumeSnapshotClassName: openebs-zfs-snapshot
    retention: 1
  publish:
    http:
      replicas: 1
      podTemplate:
        metadata:
          annotations:
            reloader.stakater.com/auto: "true"
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: nginx
              image: registry.mirrors.zjusct.io/docker.io/nginx/nginx-unprivileged:mainline-otel
              imagePullPolicy: Always
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
                readOnlyRootFilesystem: true
              ports:
                - containerPort: 8080
                  name: http
              startupProbe:
                httpGet:
                  path: /healthz
                  port: http
                periodSeconds: 2
                timeoutSeconds: 2
                failureThreshold: 30
              readinessProbe:
                httpGet:
                  path: /healthz
                  port: http
                periodSeconds: 5
                timeoutSeconds: 2
                failureThreshold: 3
              livenessProbe:
                httpGet:
                  path: /healthz
                  port: http
                periodSeconds: 10
                timeoutSeconds: 2
                failureThreshold: 6
              resources:
                requests: {cpu: "10m", memory: 32Mi}
                limits: {cpu: "4", memory: 256Mi}
              volumeMounts:
                - name: nginx-conf
                  mountPath: /etc/nginx/nginx.conf
                  subPath: nginx.conf
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
                - name: mirror-data
                  mountPath: /usr/share/nginx/html/julia-releases
                  readOnly: true
          volumes:
            - name: nginx-conf
              configMap:
                name: nginx-conf
            - name: tmp
              # 目录缓存上限 512Mi，额外空间用于正在填充的响应及其他临时文件。
              emptyDir:
                sizeLimit: 1Gi
