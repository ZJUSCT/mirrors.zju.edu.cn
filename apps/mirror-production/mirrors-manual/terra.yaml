# comment:
#   official:
#     surveyed_at: 2026-11-16
#     docs:
#       - https://wiki.ultramarine-linux.org/en/contributing/mirroring/
#       - https://github.com/terrapkg/mirror-script
#       - https://admin.fedoraproject.org/pkgdb/api/collections/
#     policy:
#       - 官方提供 mirror.sh 和 rsync-ssl 同步方式，推荐每 5 分钟同步。
#       - 公开镜像须通过 HTTPS 提供服务，配置完成后向 Tetsudou 提交收录。
#       - 仅同步处于支持周期内的 Fedora 版本仓库，EOL 版本自动清理。
#   upstreams:
#     - url: rsync://repos.fyralabs.com/repo/
#       surveyed_at: 2026-11-16
#       note: 使用官方 mirror.sh 对根目录执行过滤同步，保留所选版本的主仓库、组件、源包及对应 AppStream 目录。
apiVersion: mirrors.zjusct.io/v1alpha1
kind: Mirror
metadata:
  name: terra
  namespace: mirror-production
  labels:
    app.kubernetes.io/name: falcon
spec:
  info:
    description: Terra RPM 软件仓库
    upstream: rsync://repos.fyralabs.com/repo/
  sync:
    interval: 5m
    retryInterval: 15m
    timeout: 12h
    failureRetryLimit: 3
    keepJobs: 1
    podTemplate:
      spec:
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          seccompProfile:
            type: RuntimeDefault
        initContainers:
          - name: init-sync-volume
            image: busybox:1.37
            imagePullPolicy: Always
            command: [sh, /init/init-sync-volume.sh]
            env:
              - name: SYNC_UID
                value: "65532"
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
                add: [CHOWN]
            volumeMounts:
              - name: sync-data
                mountPath: /data
              - name: sync-volume-init
                mountPath: /init
                readOnly: true
            resources:
              requests: { cpu: 10m, memory: 16Mi }
              limits: { cpu: 100m, memory: 32Mi }
        containers:
          - name: terra
            image: ghcr.io/zjusct/terra:latest
            imagePullPolicy: Always
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
              readOnlyRootFilesystem: true
            command: [python3, /usr/local/lib/terra/sync.py]
            env:
              - name: MIRROR_DIR
                value: /data
              - name: RSYNC
                value: /usr/local/bin/terra-rsync
              - name: PARALLEL
                value: "0"
              - name: USE_RCLONE
                value: "0"
              - name: SYNC_SOURCES
                value: "1"
            volumeMounts:
              - name: tmp
                mountPath: /tmp
              - name: sync-data
                mountPath: /data
            resources:
              requests: { cpu: 500m, memory: 512Mi }
              limits: { cpu: "4", memory: 4Gi }
        volumes:
          - name: sync-volume-init
            configMap:
              name: sync-volume-init
          - name: tmp
            emptyDir: {}
  storage:
    syncStorageClassName: zfs-hdd-retain-wffc
    publishStorageClassName: zfs-hdd-delete-immediate
    pvcTemplate:
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 5Ti
      volumeMode: Filesystem
    volumeSnapshotClassName: openebs-zfs-snapshot
    retention: 1
  publish:
    http:
      replicas: 2
      podTemplate:
        metadata:
          annotations:
            reloader.stakater.com/auto: "true"
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: nginx
              image: nginxinc/nginx-unprivileged:mainline-alpine-otel
              imagePullPolicy: Always
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
                readOnlyRootFilesystem: true
              ports:
                - containerPort: 8080
                  name: http
              startupProbe:
                httpGet:
                  path: /healthz
                  port: http
                periodSeconds: 2
                timeoutSeconds: 2
                failureThreshold: 30
              readinessProbe:
                httpGet:
                  path: /healthz
                  port: http
                periodSeconds: 5
                timeoutSeconds: 2
                failureThreshold: 3
              livenessProbe:
                httpGet:
                  path: /healthz
                  port: http
                periodSeconds: 10
                timeoutSeconds: 2
                failureThreshold: 6
              resources:
                requests: { cpu: "10m", memory: 32Mi }
                limits: { cpu: "4", memory: 1Gi }
              volumeMounts:
                - name: nginx-conf
                  mountPath: /etc/nginx/nginx.conf
                  subPath: nginx.conf
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
                - name: mirror-data
                  mountPath: /usr/share/nginx/html/terra
                  readOnly: true
          volumes:
            - name: nginx-conf
              configMap:
                name: nginx-conf
            - name: tmp
              # 目录缓存上限 512Mi，额外空间用于正在填充的响应及其他临时文件。
              emptyDir:
                sizeLimit: 1Gi
