apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-webhook
spec:
  parentRefs:
    - name: envoy-gateway-production
      sectionName: https-mirrors
  hostnames:
    - mirrors.zju.edu.cn
  rules:
    - matches:
        - path:
            type: Exact
            value: /api/webhook
      backendRefs:
        - name: argo-cd-argocd-server
          namespace: argocd
          port: 80
