metadata:
  name: ctex
info:
  description: CTEX 中文 TeX 发行版安装文件与历史存档
  upstream: rsync://mirrors.tuna.tsinghua.edu.cn/ctex/
sync:
  type: rsync
  interval: 24h
  timeout: 24h
  nodeSelector:
    kubernetes.io/hostname: s1.mirrors.zjusct.io
storage:
  size: 64Gi
publish:
  http:
    tier: small
    replicas: 1
comment:
  official:
    surveyed_at: '2026-10-03'
    docs:
    - https://ctex.org/ctex/download/
    - https://ctex.org/
    policy:
    - CTEX 下载中心当前列出 BFSU、ISCAS、NJU、SJTU、TUNA、USTC 等镜像；稳定版 CTeX 3.0.216.3、最新版 3.1.218.3，并感谢 TUNA 提供下载镜像。
    - CTEX 官网未给出独立项目自营公开 rsync；此前 TUNA `ctex-upload.tuna.tsinghua.edu.cn` 是上传/同步入口，不应直接当公开 pull 源。USTC 当前从 TUNA 公共 `rsync://mirrors.tuna.tsinghua.edu.cn/ctex/`
      种子初始化。
    - 该树是 CTEX Windows 安装包和历史存档，不是 CTAN 的 ctex 宏包子树；3.0/3.1/legacy 等范围不可与 CTAN 混合。
    - 未找到官方固定同步周期；当前 24h 是本地排程候选，不是官方要求。
  bootstrap:
    status: migrated-from-ustc
    note: 2026-10-03由USTC初始化；2026-11-22切换至 CTEX 下载页官方感谢与列明的 TUNA 公共源 rsync://mirrors.tuna.tsinghua.edu.cn/ctex/（保留 -6，归档保留 interval=24h）。
  upstreams:
  - url: rsync://mirrors.tuna.tsinghua.edu.cn/ctex/
    surveyed_at: '2026-11-22'
    status: active-verified
    note: TUNA 公共源；服务器拒绝 -n (--dry-run)；s1 节点 IPv6(-6) 测速 197.3MB 文件 56.37MB/s，--list-only 全量比对 27=27 文件（0 增 / 0 删）。
  - url: rsync://rsync.mirrors.ustc.edu.cn/ctex/
    surveyed_at: '2026-10-03'
    status: retired-seed
    note: USTC 初始化种子；2026-11-22 已迁移至 TUNA。
