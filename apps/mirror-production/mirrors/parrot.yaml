metadata:
  name: parrot
info:
  description: 面向安全审计的 Parrot OS 软件仓库与安装镜像
  upstream: rsync://rsync.mirrors.ustc.edu.cn/parrot/
sync:
  type: rsync
  interval: 24h
  timeout: 24h
  nodeSelector:
    kubernetes.io/hostname: s1.mirrors.zjusct.io
storage:
  size: 2Ti
publish:
  http:
    tier: small
    replicas: 1
comment:
  official:
    surveyed_at: '2026-10-02'
    docs:
    - https://parrotsec.org/docs/mirrors/make-mirror/
    policy:
    - 官方完整仓库 cron 示例每日一次，使用 --delete-after；全模块包含 ISO。
  bootstrap:
    note: 用户已通知 USTC；先初始化，官方源可行时验证后切换；初始任务暂停自动排程并按批次手动放行。
    official_interval: 24h
  upstreams:
  - url: rsync://rsync.mirrors.ustc.edu.cn/parrot/
    surveyed_at: '2026-09-30'
    status: selected
    note: 模块根已在前期调查验证，首次初始化源。
  - url: rsync://rsync.parrot.sh/parrot/
    surveyed_at: '2026-09-30'
    note: 后续官方源；须先验证访问、新鲜度、路径、删除集与完整性。
