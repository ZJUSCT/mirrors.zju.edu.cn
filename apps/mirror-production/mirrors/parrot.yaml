metadata:
  name: parrot
info:
  description: 面向安全审计的 Parrot OS 软件仓库与安装镜像
  upstream: rsync://rsync.parrot.sh/parrot/
sync:
  type: rsync
  ipv6: false
  interval: 6h
  timeout: 24h
  nodeSelector:
    kubernetes.io/hostname: s1.mirrors.zjusct.io
storage:
  size: 2Ti
publish:
  http:
    tier: small
    replicas: 1
comment:
  official:
    surveyed_at: '2026-11-21'
    docs:
    - https://parrotsec.org/docs/mirrors/make-mirror/
    - https://parrotsec.org/docs/mirrors/mirrors-list/
    policy:
    - 官方完整仓库 rsync 模块为 /parrot（包含 ISO）；文档示例 cron 每日一次并使用 --delete-after。
    - rsync.parrot.sh 使用 GeoDNS 自动分配最近上游，IPv6 (-6) 实测超时，不强制 -6（sync.ipv6=false）可直连通过。
  upstreams:
  - url: rsync://rsync.parrot.sh/parrot/
    surveyed_at: '2026-11-21'
    status: selected
    note: 官方 GeoDNS rsync 源；未加 -6 时 dry-run 12s（+36 / 79.13M / 0 删除），79M 包实测 7.15 MB/s。
  - url: rsync://ftp.nluug.nl/parrot/
    surveyed_at: '2026-11-21'
    status: verified-backup
    note: 荷兰学术网备用 IPv6 (-6) 源；dry-run 16s，79M 包实测 9.68 MB/s。
