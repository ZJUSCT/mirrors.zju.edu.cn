metadata:
  name: knoppix-dvd
info:
  description: KNOPPIX 的 DVD 安装镜像
  upstream: rsync://rsync.mirrors.ustc.edu.cn/knoppix-dvd/
sync:
  type: rsync
  interval: 24h
  timeout: 24h
  nodeSelector:
    kubernetes.io/hostname: s1.mirrors.zjusct.io
storage:
  size: 36Gi
publish:
  http:
    tier: small
    replicas: 1
comment:
  official:
    surveyed_at: '2026-10-03'
    docs:
    - https://www.knopper.net/knoppix-mirrors/index-en.html
    - https://www.knopper.net/knoppix/
    policy:
    - 官方镜像表明确列出 ftp.uni-kl.de 的独立 `rsync DVD` 模块，并将该站标为推荐 master；DVD 不能作为 `/knoppix/` 子目录 alias。
    - 本次官方 `rsync://ftp.uni-kl.de/knoppix-dvd/` 根列表成功，但最新列出的 KNOPPIX_V9.1DVD 文件时间为 2021-02-19，不能视作当前新鲜官方增量。
    - DVD 根含 ISO、校验和、`.asc` 签名、`packages-dvd.txt` 等；以 ISO 与签名文件成对验收，避免只同步 ISO。
    - 未找到官方固定同步周期；当前 24h 是本地排程候选，不是官方要求。
  bootstrap:
    note: USTC 首次同步于 2026-10-03T06:15:14Z UTC 成功，发布于 2026-10-03T06:15:25Z UTC；当前 mirrors.zjusct.io/sync-paused=true，自动同步保持暂停。USTC
      初始化成功；官方 DVD rsync 列表停留在 2021，暂不切换，保持已发布 USTC 快照和暂停状态。
  upstreams:
  - url: rsync://rsync.mirrors.ustc.edu.cn/knoppix-dvd/
    surveyed_at: '2026-10-03'
    status: selected
    note: USTC 首次同步源；站点报告容量 17.39 GiB，不是实际占用保证。
  - url: rsync://ftp.uni-kl.de/knoppix-dvd/
    surveyed_at: '2026-10-03'
    note: 官方或项目认可的后续候选；尚未切换，先验证协议、范围、新鲜度、签名与删除集。
