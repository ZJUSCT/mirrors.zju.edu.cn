metadata:
  name: zerotier
info:
  description: ZeroTier 虚拟组网工具的软件包
  upstream: https://download.zerotier.com/
sync:
  type: tsumugu
  interval: 6h
  timeout: 24h
  nodeSelector:
    kubernetes.io/hostname: s1.mirrors.zjusct.io
  tsumugu:
    parser: nginx
    threads: 8
    max_delete: 100
    extra_args:
      # 根文件 contact@zerotier.com.gpg 的 HTTP 头异常导致 tsumugu 猜时区失败，显式固定 UTC (+0)
      - --timezone
      - "0"
storage:
  size: 64Gi # 2026-11-22：官方全树 36,454 对象 / 39.46GiB，原 24Gi 配额不足，扩容并预留增长空间。
publish:
  http:
    tier: small
    replicas: 1
comment:
  official:
    surveyed_at: '2026-10-03'
    docs:
    - https://download.zerotier.com/
    - https://docs.zerotier.com/install/linux/
    policy:
    - ZeroTier 官方下载站是 HTTPS 目录，根含 RELEASES、PRERELEASES、debian、redhat、dist、obsolete；2026-05-27 更新的 RELEASES/debian/dist 目录可见。
    - USTC module 是 rsync 初始化种子，不能将其成功复制等同于官方仍提供 rsync。官方 HTTPS 目录没有本次确认的 rsync module；现有生产模板只允许 rsync/ftpsync/qfm/tsumugu，尚未证明官方目录与
      tsumugu 的稳定 parser、包签名和链接范围完全适配。
    - 官方目录包含 Debian 多发行版目录（含 trixie、bookworm、noble、resolute 等）及 dist/；切换前必须固定范围、检查 Release/Packages 签名和淘汰目录，不能把所有历史目录自动删除。
    - 未找到官方固定同步周期；当前 24h 是本地排程候选，不是官方要求。
  bootstrap:
    status: migrated-from-ustc
    note: 2026-10-03由USTC初始化（10.26GiB 子集）；2026-11-22 扩容 storage.size 至 64Gi 并切至官方 HTTPS https://download.zerotier.com/（tsumugu parser=nginx, threads=8, --timezone 0, interval=1h）。
  upstreams:
  - url: https://download.zerotier.com/
    surveyed_at: '2026-11-22'
    status: active-verified
    note: 官方 HTTPS；加 --timezone 0 后 s1 节点 8 并发 dry-run 耗时 58s 退出 0（36,454 对象 / 39.46GiB，0 删除，补齐原 USTC 未含的 RELEASES/redhat/debian 历史包）。
  - url: rsync://rsync.mirrors.ustc.edu.cn/zerotier/
    surveyed_at: '2026-10-03'
    status: retired-seed
    note: USTC 初始化种子；2026-11-22 已迁移至官方 HTTPS。
