metadata:
  name: sagemath
info:
  description: 构建在 NumPy, SciPy 等工具之上的开源数学软件系统
  upstream: rsync://mirror.aarnet.edu.au/sage/
sync:
  type: rsync
  interval: 24h
  timeout: 24h
  nodeSelector:
    kubernetes.io/hostname: s1.mirrors.zjusct.io
storage:
  size: 488Gi
publish:
  http:
    tier: small
    replicas: 1
comment:
  official:
    surveyed_at: '2026-11-21'
    docs:
    - https://www.sagemath.org/download.html
    - https://www.sagemath.org/mirrors.html
    policy:
    - SageMath 官方镜像列表收录澳大利亚 AARNet 学术网源（rsync://mirror.aarnet.edu.au/sage/），目录仅含 devel/、spkg/、src/、zzz/ 及根文件，无需额外 --exclude 历史平台目录。
    - 稳定源码与 devel/ 测试版约每 1 至 2 周更新；维持 24h 周期与 488Gi 存储（实测全树 7,129 文件 / 273.40G）。
  upstreams:
  - url: rsync://mirror.aarnet.edu.au/sage/
    surveyed_at: '2026-11-21'
    status: selected
    note: 官方镜像列表 AARNet 源（IPv6 -6 可达）；s1 dry-run 2s（+1 / 515 文件 4.16M / 0 删除），65M 包实测 11.83 MB/s。
  - url: rsync://ftp.riken.jp/sagemath/
    surveyed_at: '2026-11-21'
    status: verified-backup
    note: 官方镜像列表日本 RIKEN 源（无 IPv6，不写 -6 可用）；65M 包实测 10.01 MB/s。
  - url: rsync://mirror.csclub.uwaterloo.ca/sage/
    surveyed_at: '2026-11-21'
    status: verified-backup
    note: 备用 IPv6 源；dry-run 6s（0 删除），65M 包实测 4.82 MB/s。
