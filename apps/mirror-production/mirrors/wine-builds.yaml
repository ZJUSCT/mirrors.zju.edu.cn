metadata:
  name: wine-builds
info:
  description: 在类 Unix 系统上运行 Windows 应用的 Wine 软件包
  upstream: https://dl.winehq.org/wine-builds/
sync:
  type: tsumugu
  interval: 24h
  timeout: 168h
  nodeSelector:
    kubernetes.io/hostname: s1.mirrors.zjusct.io
  tsumugu:
    parser: apache-f2
    threads: 12
    max_delete: 100
    extra_args:
      - --exclusion-v2
      - --exclude
      - ^/(debian/dists/bookworm|ubuntu/dists/jammy)/main/binary-all(/|$)
storage:
  size: 2Ti
publish:
  http:
    tier: small
    replicas: 1
comment:
  official:
    surveyed_at: '2026-10-03'
    docs:
    - https://dl.winehq.org/wine-builds/
    - https://gitlab.winehq.org/wine/wine/-/wikis/Debian-Ubuntu
    - https://gitlab.winehq.org/wine/wine/-/wikis/Fedora
    policy:
    - 保持官方根完整目录树同步（android/、debian/、fedora/、macosx/、mageia/、ubuntu/ 与 Release.key、winehq.key），仅排除上游已知 404 的空 binary-all 目录。
    - 保留既有发行版、架构、历史包及 stable/devel/staging 分支；不能按仅当前支持发行版的脚本缩小范围，也不能全局删 i386。保留官方签名元数据、包、密钥和 sources/repo 文件，不改写或重签。
    - 本机 tsumugu 0.20260921.0 的 apache-f2 已实际通过官方根、Debian/Ubuntu dists 和 pool、Fedora 44 repodata 与 RPM 目录解析；默认 nginx 失败。现有
      tsumugu 模板可设置 parser 与范围过滤，无需新同步类型。
    - 官方 Debian trixie 与 Ubuntu noble InRelease 的 gpgv 校验通过，签名密钥 D43F640145369C51D786DDEA76F1A20FF987672F；trixie/amd64 Packages.gz
      摘要与签名索引匹配。此为样本验证，未全面校验种子或 RPM。
    - 未发现官方固定镜像周期；24h 是当前本地配置，旧建议 6h 也不是官方要求。
  bootstrap:
    note: 2026-10-03 由 USTC 首次同步（114.18 GiB 裁剪子集，后 USTC 撤下模块）；2026-11-24 通过 NJU rsync（rsync://mirrors.nju.edu.cn/wine-builds/）完成 debian/fedora/ubuntu 补全（1.13 TiB）并发布，后续需全量保留 android/macosx/mageia（约 1.32 TiB，可通过 NJU bootstrap 补齐后再由官方 HTTPS + tsumugu 保持全量增量同步）。
    official_cutover_status: full-tree-tsumugu-ready
  upstreams:
  - url: https://dl.winehq.org/wine-builds/
    surveyed_at: '2026-11-24'
    status: selected
    note: '保持官方 HTTPS + tsumugu/apache-f2（threads 12，timeout 168h，2Ti PVC）全量同步，仅排除 404 的空 binary-all 目录；大容量初始/全量补齐可通过 NJU rsync bootstrap 完成。'
  - url: rsync://mirrors.nju.edu.cn/wine-builds/
    surveyed_at: '2026-11-24'
    status: bootstrap-seed
    note: '用于 2026-11-24 快速补全 1.13 TiB（debian/fedora/ubuntu）及全量（约 1.32 TiB）bootstrap 种子。'
  - url: rsync://rsync.mirrors.ustc.edu.cn/wine-builds/
    surveyed_at: '2026-11-21'
    status: obsolete
    note: '仅用于 2026-10-03 首次同步；2026-11-21 实测前端页面已下线且 rsync 返回 @ERROR: chdir failed。'
