metadata:
  name: remi
info:
  description: 包含最新版本 PHP 和 MySQL 的第三方 yum 源
  upstream: rsync://rsync.mirrors.ustc.edu.cn/remi/
sync:
  type: rsync
  interval: 24h
  timeout: 24h
  nodeSelector:
    kubernetes.io/hostname: s1.mirrors.zjusct.io
storage:
  size: 612Gi
publish:
  http:
    tier: small
    replicas: 1
comment:
  official:
    surveyed_at: '2026-10-02'
    docs:
    - https://blog.remirepo.net/pages/English-FAQ#sync
    policy:
    - USTC remi是已经拼合的enterprise/fedora及根文件，单module原样种子可发布；官方根不是数据模块，需分enterprise/fedora+HTTP根文件，源IPv4/IPv6白名单。Sep30生产两模块双栈拒绝。
    - 未找到；6h为本地建议
  bootstrap:
    note: 用户已通知 USTC；初始放行由会话按并发上限控制。官方源可行时验证后切换，否则先记录阻塞，不擅自改写内容。
    official_interval_candidate: 6h
  upstreams:
  - url: rsync://rsync.mirrors.ustc.edu.cn/remi/
    surveyed_at: '2026-10-02'
    status: selected
    note: USTC 首次初始化源；容量 305.01 GiB 为站点报告值，非实际占用保证。
  - url: rsync://rpms.remirepo.net/
    surveyed_at: '2026-10-02'
    note: 官方或项目认可的后续调查入口；只有验证协议、范围、签名和完整性后才能切换。
