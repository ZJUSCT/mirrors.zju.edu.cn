metadata:
  name: remi
info:
  description: 包含最新版本 PHP 和 MySQL 的第三方 yum 源
  upstream: rsync://mirror.netone.nl/remi/
sync:
  type: rsync
  interval: 6h
  timeout: 24h
  nodeSelector:
    kubernetes.io/hostname: s1.mirrors.zjusct.io
storage:
  size: 612Gi
publish:
  http:
    tier: small
    replicas: 1
comment:
  official:
    surveyed_at: '2026-10-02'
    docs:
    - https://blog.remirepo.net/pages/English-FAQ#sync
    policy:
    - USTC remi是已经拼合的enterprise/fedora及根文件；官方主站 rpms.remirepo.net 对未登记 IP 拒绝直连，改从官方镜像列表内的完整双栈镜像 mirror.netone.nl 同步。
    - 官方 FAQ 未规定固定同步周期；本站选用 6h。
  upstreams:
  - url: rsync://mirror.netone.nl/remi/
    surveyed_at: '2026-11-22'
    status: active-verified
    note: 官方列表完整双栈镜像；s1 节点 IPv6(-6) 测速 10.5M RPM 1.62MB/s，768,730 文件 dry-run 耗时 30s（483.30G，+3,223 / 2.96G，-21,148 均为官方已清理旧包）。
  - url: rsync://rsync.mirrors.ustc.edu.cn/remi/
    surveyed_at: '2026-10-02'
    status: retired-seed
    note: USTC 初始化种子（保留了约2.1万个上游已清理的旧包）；2026-11-22 已迁移至 mirror.netone.nl。
