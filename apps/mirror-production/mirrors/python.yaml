metadata:
  name: python
info:
  description: Python 官方源码、软件、文档仓库
  upstream: https://www.python.org/ftp/python/
sync:
  type: tsumugu
  interval: 24h
  timeout: 24h
  nodeSelector:
    kubernetes.io/hostname: s1.mirrors.zjusct.io
  tsumugu:
    parser: nginx
    threads: 8
    max_delete: 100
    extra_args:
      - --exclusion-v2
      # 排除上游返回 403 的临时目录以及非 nginx 目录列表的 1990 年代静态 HTML 页 (/mail, /nt, /wpy, /download, /pc, /win32)
      - --exclude
      - '^/([^/]+/(tmp|windows-fixed)|mail|nt|wpy|download|pc|win32)(/|$)'
storage:
  size: 256Gi # 2026-11-22：官方全树约 181.96GiB，原 180Gi 配额不足，扩容并预留增长空间。
publish:
  http:
    tier: small
    replicas: 1
comment:
  official:
    surveyed_at: '2026-10-03'
    docs:
    - https://www.python.org/ftp/python/
    - https://www.python.org/downloads/
    - https://www.python.org/downloads/metadata/sigstore/
    policy:
    - 官方 https://www.python.org/ftp/python/ 是 Python 发行源码、Windows/macOS安装器、嵌入包、文档及历史版本目录树，与 PyPI 软件包仓库不同；保留完整 /ftp/python/
      根映射，不替换成 downloads 页面或某个最新版本。
    - 现有 tsumugu nginx parser 对根、3.14.0/、3.14.0/amd64/ 三级目录均 exit0，可枚举文件名、时间、大小；官方HTML提供标准目录索引，属于现有模板候选，没有发现需要专用同步器的证据。尚未验证所有历史子目录/全树删除集。
    - 根下有版本目录以及其他平台/文档资源；3.14.0 包含源码压缩包、Windows MSI/EXE、签名bundle等，不能只同步tarball。维持文件时间戳、相对路径和伴随元数据，不改写签名材料。
    - 官方说明 Python 3.14 起只提供 Sigstore 验证；较早系列还提供 legacy OpenPGP。验证需要匹配发布者证书身份和OIDC issuer；不能把缺少.asc当3.14发布损坏，也不能把bundle字节相同当签名验证成功。
    - 未找到本轮可确认的官方公共 rsync 或固定镜像轮询周期；24h 是本站选择。HTTPS已有parser候选，应继续验证，而非因没有rsync就判定现有四类模板均不支持。
  bootstrap:
    status: migrated-from-ustc
    note: 2026-10-03由USTC初始化（job python-sync-1791052733）；2026-11-22切换至官方 HTTPS + tsumugu（parser=nginx, threads=8, interval=24h），并将 storage.size 从 180Gi 扩至 256Gi。
  validation:
    observed_at: '2026-11-22'
    completed:
    - 2026-11-22 在 s1.mirrors.zjusct.io 对只读挂载的 python-sync（81G 已用 / 100G 可用）执行 tsumugu sync --dry-run，排除上游 403 目录与旧静态 HTML 页后耗时 19s 退出 0：共 50,529 对象 / 181.96GiB（超出原 180Gi 配额故扩至 256Gi）。
    - 公网 3.14.0/Python-3.14.0.tar.xz.sigstore 与官方同路径逐字节相同：5374字节，SHA256=83cf46269926bf166ca1b67e5647c44152a300a0f6d30cbbce147099e072bf41。
  upstreams:
  - url: https://www.python.org/ftp/python/
    surveyed_at: '2026-11-22'
    status: active-verified
    note: 官方 HTTPS 软件源 + tsumugu/nginx；排除 ^/([^/]+/(tmp|windows-fixed)|mail|nt|wpy|download|pc|win32)(/|$) 后 19s dry-run 退出 0（50,529 对象 / 181.96GiB）。
  - url: rsync://rsync.mirrors.ustc.edu.cn/python/
    surveyed_at: '2026-10-03'
    status: retired-seed
    note: USTC 初始化种子；2026-11-22 已迁移至官方 HTTPS。
