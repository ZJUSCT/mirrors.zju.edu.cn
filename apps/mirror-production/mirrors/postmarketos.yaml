metadata:
  name: postmarketos
info:
  description: 面向移动设备、基于 Alpine Linux 的 Linux 发行版（现名 Nura）
  upstream: rsync://mirror.nura.eco/postmarketos/
sync:
  type: rsync
  interval: 4h
  timeout: 24h
  # WaitForFirstConsumer 首次落盘到 s1；PVC 绑定后可移除此选择器。
  nodeSelector:
    kubernetes.io/hostname: s1.mirrors.zjusct.io
storage:
  size: 128Gi
publish:
  http:
    tier: small
    replicas: 1
comment:
  official:
    surveyed_at: '2026-10-03'
    docs:
    - https://nura.eco/mirrors/
    - https://wiki.postmarketos.org/wiki/Infrastructure
    policy:
    - 项目现名 Nura，官方镜像页列出 rsync://mirror.nura.eco/postmarketos/（与原 mirror.postmarketos.org 同一主机）。
    - 有界根列表成功并显示 master 软链接、main/、extra-repos/ 及 v20.05 至 v26.06 版本树；切换时必须保留 symlink、目录层级和历史版本，不把 Nura 改名重写到发布路径。
    - 未查到官方固定同步周期；4h 为本站本地排程。
  bootstrap:
    status: migrated-from-ustc
    job: postmarketos-sync-1790953371
    succeeded_at: '2026-10-02T18:00:24Z'
    published_at: '2026-10-02T18:00:32Z'
    note: 2026-10-02由USTC初始化成功并发布；2026-11-21切换至官方新品牌域名 rsync://mirror.nura.eco/postmarketos/（保留 -6，interval=4h）。
  upstreams:
  - url: rsync://mirror.nura.eco/postmarketos/
    surveyed_at: '2026-11-21'
    status: active-verified
    note: 官方新品牌域名（与 mirror.postmarketos.org 同机）；s1 节点 IPv6(-6) 实测 14M .apk 1.88MB/s（mirror.postmarketos.org 测得 2.56MB/s），完整 dry-run 14s（28,137 文件 / 64.20G，+47 / -47，567.23M）。
  - url: rsync://rsync.mirrors.ustc.edu.cn/postmarketos/
    surveyed_at: '2026-10-03'
    status: retired-seed
    note: USTC 初始化种子；2026-11-21 已迁移至官方源。
  verification:
    surveyed_at: '2026-11-21'
    checks:
    - 官方 Nura 页面 https://nura.eco/mirrors/ HTTP 200；2026-11-21 在 s1.mirrors.zjusct.io 对只读挂载的 postmarketos-sync（58G 已用 / 71G 可用）执行 IPv6(-6) 完整 --dry-run，14s 退出 0：28,137 文件 / 64.20G，+47 / -47（567.23M），保留 master -> main 软链接。
