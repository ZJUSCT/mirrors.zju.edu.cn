metadata:
  name: fedora-ostree
info:
  description: Fedora Atomic Desktop 的 OSTree 基础层
  upstream: https://ostree.fedoraproject.org
sync:
  type: ostree
  interval: 2h
  timeout: 12h
  ostree:
    remote_name: fedora
    content_url: mirrorlist=https://ostree.fedoraproject.org/mirrorlist
storage:
  size: 5Ti
publish:
  http:
    tier: standard
    replicas: 2
comment:
  official:
    surveyed_at: 2026-11-12
    docs:
      - https://src.fedoraproject.org/rpms/fedora-repos/raw/rawhide/f/fedora.conf
      - https://docs.fedoraproject.org/en-US/atomic-desktops
      - https://discussion.fedoraproject.org/t/mirrorlist-missing-error-on-kinoite-update/138912/4
      - https://ostreedev.github.io/ostree/man/ostree.repo-config.html
    policy:
      - 官方 remote 使用 HTTP(S)；主地址提供元数据，contenturl 的官方 mirrorlist 指定内容下载地址。
      - 内容经 CloudFront 分发；使用 ostree pull --mirror 同步，不依赖目录列表。
      - 官方未规定镜像同步频率；updates 通道 compose 约每日一次。

  upstreams:
    - url: https://ostree.fedoraproject.org
      surveyed_at: 2026-11-12
      status: selected
      note: 官方元数据入口，内容通过官方 mirrorlist 分发；包含 Fedora Atomic Desktops 分支及 CoreOS 与 Atomic Host 历史分支。
