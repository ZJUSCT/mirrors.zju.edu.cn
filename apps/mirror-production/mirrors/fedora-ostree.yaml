metadata:
  name: fedora-ostree
info:
  description: Fedora Atomic Desktop 的 OSTree 基础层
  upstream: https://ostree.fedoraproject.org
sync:
  type: ostree
  interval: 2h
  timeout: 12h
  ostree:
    remote_name: fedora
    content_url: mirrorlist=https://ostree.fedoraproject.org/mirrorlist
storage:
  size: 5Ti
publish:
  http:
    tier: standard
    replicas: 2
comment:
  official:
    surveyed_at: 2026-11-11
    docs:
      - https://ostree.fedoraproject.org
      - https://docs.fedoraproject.org/en-US/atomic-desktops
      - https://discussion.fedoraproject.org/t/mirrorlist-missing-error-on-kinoite-update/138912/4
      - https://ostreedev.github.io/ostree/man/ostree.repo-config.html
    policy:
      - 上游经 S3/CloudFront 分发，ostree mirror 协议是唯一同步通道。
      - 主地址提供 summary，objects 需通过 contenturl 的官方 mirrorlist 下载。
      - 官方未规定镜像同步频率；updates 通道 compose 约每日一次。

  upstreams:
    - url: https://ostree.fedoraproject.org
      surveyed_at: 2026-11-10
      status: selected
      note: 官方唯一分发点，包含所有 Atimoc Desktop 分支及 CoreOS 与 Atomic Host 历史分支。
