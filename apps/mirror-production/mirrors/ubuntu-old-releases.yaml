metadata:
  name: ubuntu-old-releases
info:
  description: Ubuntu 历史版本的安装镜像与软件包归档
  upstream: rsync://rsync.mirrors.ustc.edu.cn/ubuntu-old-releases/
sync:
  type: rsync
  interval: 24h
  timeout: 24h
  nodeSelector:
    kubernetes.io/hostname: s1.mirrors.zjusct.io
storage:
  size: 17572Gi
publish:
  http:
    tier: small
    replicas: 1
comment:
  official:
    surveyed_at: '2026-10-02'
    docs:
    - https://old-releases.ubuntu.com/
    policy:
    - 官方HTTP根releases/和ubuntu/，USTC镜像总量8.58TiB；完整内容直接复制，不能仅按ISO预算。
    - 磁盘预算和初始化超时由父任务控制；这是历史仓库，保持内容范围，不与当前ubuntu合并。
  bootstrap:
    note: 用户已通知 USTC；初始放行由会话按并发上限控制。官方源可行时验证后切换，否则先记录阻塞，不擅自改写内容。
    official_interval_candidate: 168h
  upstreams:
  - url: rsync://rsync.mirrors.ustc.edu.cn/ubuntu-old-releases/
    surveyed_at: '2026-10-02'
    status: selected
    note: USTC 首次初始化源；容量 8.58 TiB 为站点报告值，非实际占用保证。
  - url: rsync://old-releases.ubuntu.com/old-releases/
    surveyed_at: '2026-10-02'
    note: 官方或项目认可的后续调查入口；只有验证协议、范围、签名和完整性后才能切换。
