metadata:
  name: ubuntu-old-releases
info:
  description: Ubuntu 历史版本的安装镜像与软件包归档
  upstream: rsync://old-releases.ubuntu.com/old-releases/ # Canonical 官方归档源
sync:
  type: rsync
  ipv6: false # ps6 组 AAAA(2620:2d:4002:1002::*) 873 端口超时，不传 -6 由双栈优先走 IPv4
  interval: 168h
  timeout: 24h
  nodeSelector:
    kubernetes.io/hostname: s1.mirrors.zjusct.io
storage:
  size: 17572Gi
publish:
  http:
    tier: small
    replicas: 1
comment:
  official:
    surveyed_at: '2026-10-02'
    docs:
    - https://old-releases.ubuntu.com/
    policy:
    - 官方HTTP根releases/和ubuntu/，USTC镜像总量8.58TiB；完整内容直接复制，不能仅按ISO预算。
    - 磁盘预算和初始化超时由父任务控制；这是历史仓库，保持内容范围，不与当前ubuntu合并。
  upstreams:
  - url: rsync://old-releases.ubuntu.com/old-releases/
    stack: dual
    surveyed_at: '2026-11-21'
    status: selected
    metrics: 's1 实测 ps5 IPv6 19.25–59.91 MB/s；ps6 IPv6(2620:2d:4002:1002::*) 873 端口超时；6 个 IPv4 均连通(ps5 28.76 MB/s, ps6 14.79–20.51 MB/s)'
    note: 'Canonical 官方归档源；因半数 AAAA 端口 873 不可达且 rsync --contimeout 不会在单轮超时前跨协议重试，设置 ipv6: false 不传 -6（默认双栈优先 IPv4）；历史归档按 168h 周期同步，已在盘全量 528.6 万文件/9.27 TB 与官方 .trace 对齐。'
  - url: rsync://rsync.mirrors.ustc.edu.cn/ubuntu-old-releases/
    surveyed_at: '2026-10-02'
    status: rejected
    note: '历史初始化源；已完成全量底包同步，现切回 Canonical 官方源。'
