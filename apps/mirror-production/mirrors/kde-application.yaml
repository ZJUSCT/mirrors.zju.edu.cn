metadata:
  name: kde-application
info:
  description: KDE 应用程序源码镜像
  upstream: rsync://rsync.kde.org/applicationdata/
sync:
  type: rsync
  interval: 4h
  timeout: 24h
  nodeSelector:
    kubernetes.io/hostname: s1.mirrors.zjusct.io
storage:
  size: 1368Gi
publish:
  http:
    tier: small
    replicas: 1
comment:
  official:
    surveyed_at: '2026-10-02'
    docs:
    - https://kde.org/mirrors/ftp_howto/
    policy:
    - applicationdata不是kdeftp，也不是包含两者的alldata；root含digikam/kdenlive/krita/kde-linux等，原样目录树。
    - 官方明确in-app data必须每2h
  bootstrap:
    note: 用户已通知 USTC；初始放行由会话按并发上限控制。官方源可行时验证后切换，否则先记录阻塞，不擅自改写内容。
    official_interval_candidate: 2h
  upstreams:
  - url: rsync://rsync.kde.org/applicationdata/
    stack: dual
    status: selected
    surveyed_at: '2026-11-21'
    metrics: IPv6 6.1MB/s、IPv4 3.4MB/s
    note: 'KDE 官方 applicationdata 入口；IPv6 可达且根目录 14 项与存量 1:1 一致，按官方 ftp_howto 设 interval=2h。'
  - url: rsync://rsync.mirrors.ustc.edu.cn/kde-application/
    surveyed_at: '2026-11-21'
    status: bootstrap-complete
    note: USTC 首次初始化源（上轮均速 2.45MB/s）；现已切换至官方源。
