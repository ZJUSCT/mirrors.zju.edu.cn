metadata:
  name: blackarch
info:
  description: 面向渗透测试与安全研究的 Arch Linux 衍生发行版
  upstream: rsync://rsync.mirrorservice.org/blackarch.org/blackarch/
sync:
  type: rsync
  interval: 6h
  timeout: 24h
  # WaitForFirstConsumer 首次落盘到 s1；PVC 绑定后可移除此选择器。
  nodeSelector:
    kubernetes.io/hostname: s1.mirrors.zjusct.io
storage:
  size: 200Gi
publish:
  http:
    tier: small
    replicas: 1
comment:
  official:
    surveyed_at: '2026-10-03'
    docs:
    - https://blackarch.org/downloads.html#mirror-list
    policy:
    - 官方镜像页把 rsync://blackarch.org/blackarch/ 列为官方镜像入口；有界 --list-only（exit 0）显示 lastupdate、blackarch/、iso/、ova/、torrent/ 五项顶层内容。
    - USTC 首次树缺少 torrent/；切换候选源前必须保留官方完整顶层范围和安全链接，不能让当前快照的缺项掩盖删除差异。
    - 未查到官方固定同步周期；6h 是本站本地排程候选，不是官方要求。
  bootstrap:
    status: migrated-from-ustc
    job: blackarch-sync-1790957622
    succeeded_at: '2026-10-02T18:12:09Z'
    published_at: '2026-10-02T18:12:18Z'
    note: 2026-10-02由USTC初始化成功并发布；2026-11-22切换至官方列表中的 UK Mirror Service rsync://rsync.mirrorservice.org/blackarch.org/blackarch/（保留 -6，interval=6h）。
  upstreams:
  - url: rsync://rsync.mirrorservice.org/blackarch.org/blackarch/
    surveyed_at: '2026-11-22'
    status: active-verified
    note: 官方镜像表收录站点；s1 节点 IPv6(-6) 测速 4.29MB/s，完整 dry-run 8s（19,741 文件 / 101.09G，+5 / 667.16K，0 删除）。
  - url: rsync://ftp.halifax.rwth-aachen.de/blackarch/
    surveyed_at: '2026-11-22'
