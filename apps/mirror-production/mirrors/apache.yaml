metadata:
  name: apache
info:
  description: Apache 软件基金会项目发布文件
  upstream: rsync://rsync.apache.org/apache-dist/
sync:
  type: rsync
  interval: 6h
  timeout: 24h
  nodeSelector:
    kubernetes.io/hostname: s1.mirrors.zjusct.io
storage:
  size: 800Gi
publish:
  http:
    tier: small
    replicas: 1
comment:
  official:
    surveyed_at: '2026-11-21'
    docs:
    - https://www.apache.org/info/how-to-mirror.html
    - https://www.apache.org/mirrors
    policy:
    - 官方 apache-dist rsync 模块仍开放；指南建议每日同步 4 次（6h），保留 --delete 与 --safe-links 且不改写 HEADER.html/README.html。
    - 现有 rsync 模板（含 -6）可直接与官方双栈源配合，无需额外排他规则。
  upstreams:
  - url: rsync://rsync.apache.org/apache-dist/
    surveyed_at: '2026-11-21'
    status: selected
    note: 官方 ASF 源站（IPv6 -6 可达）；s1 dry-run 80s（162,482 文件 / 363.22G，+130 / -35 / 2.38G 待传），119M 文件实测 11.40 MB/s。
