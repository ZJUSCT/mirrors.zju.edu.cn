metadata:
  name: apache
info:
  description: Apache 软件基金会项目发布文件
  upstream: rsync://rsync.mirrors.ustc.edu.cn/apache/
sync:
  type: rsync
  interval: 24h
  timeout: 24h
  nodeSelector:
    kubernetes.io/hostname: s1.mirrors.zjusct.io
storage:
  size: 800Gi
publish:
  http:
    tier: small
    replicas: 1
comment:
  official:
    surveyed_at: '2026-10-02'
    docs:
    - https://www.apache.org/mirrors
    policy:
    - 官方镜像网络于 2021 年退役，但官方 apache-dist 仍开放；不使用范围不同的 apache-dist-most；周期暂拟 6h。
  bootstrap:
    note: 用户已通知 USTC；先初始化，官方源可行时验证后切换；初始任务暂停自动排程并按批次手动放行。
    official_interval: 6h
  upstreams:
  - url: rsync://rsync.mirrors.ustc.edu.cn/apache/
    surveyed_at: '2026-09-30'
    status: selected
    note: 模块根已在前期调查验证，首次初始化源。
  - url: rsync://rsync.apache.org/apache-dist/
    surveyed_at: '2026-09-30'
    note: 后续官方源；须先验证访问、新鲜度、路径、删除集与完整性。
