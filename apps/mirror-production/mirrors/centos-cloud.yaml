metadata:
  name: centos-cloud
info:
  description: 适用于云平台的 CentOS 通用系统镜像
  upstream: rsync://mirrors.nju.edu.cn/centos-cloud/
sync:
  type: rsync
  interval: 24h
  timeout: 24h
  nodeSelector:
    kubernetes.io/hostname: s1.mirrors.zjusct.io
storage:
  size: 3Ti
publish:
  http:
    tier: small
    replicas: 1
comment:
  official:
    surveyed_at: '2026-10-31'
    docs:
    - https://cloud.centos.org/
    - https://cloud.centos.org/centos/
    - https://mirrors.nju.edu.cn/centos-cloud/
    policy:
    - 完整同步根目录的altarch/、centos/、TIME和timestamp.txt，保留全部架构及6、7、8、8-stream、9-stream、10-stream、scos历史目录。
    - 原样保留校验和、签名及文件内容；使用rsync -aH保留上游硬链接，避免为同一硬链接重复分配空间。
    - 未查到官方明确公开的rsync端点或固定同步周期；24h为本站同步间隔。
  upstreams:
  - url: rsync://mirrors.nju.edu.cn/centos-cloud/
    surveyed_at: '2026-10-31'
    status: selected
    stack: ipv6
    note: 从s1节点对已发布副本执行只读全树dry-run，约8秒完成，退出0；无目录或架构排除项。
  verification:
    surveyed_at: '2026-10-31'
    checks:
    - NJU全树列出7893项（7704个普通文件、189个目录），路径逻辑大小合计约2.63TB；该总量包含硬链接重复计数，不等于实际占用。
    - 相对2026-10-05发布副本，预演新增6688个文件路径（含1467个硬链接）、148个目录，删除214个文件；需要传输的5331个文件逻辑大小约1.55TB，不等于实际网络流量。
    - 旧副本仅含centos/下部分Stream及SCOS目录。用户确认改为完整同步NJU，并将864Gi配额提高到3Ti。
    - 抽查Stream 9及10的x86_64/images目录，文件名集合及CHECKSUM文件与官方完全一致；未全量下载镜像或验证镜像文件摘要。
    - NJU时间戳为2026-10-30T14:24:01Z，检查时官方为2026-10-31T08:12:01Z；时间戳滞后约18小时，不代表每个镜像文件均落后。
