    - 对只读挂载的 openresty-sync（126G 已用 / 163G 可用）执行 tsumugu sync --dry-run --parser nginx --threads 8 --max-delete 100 --exclusion-v2 --exclude '^/amazon/2022\.0\.' https://openresty.org/package/ /data/，34s 退出 0：89,791 对象 / 190.01GiB，0 删除，待补齐 amazon(21,007)、tlinux(5,390)、oracle(5,155)、alinux(2,318) 共 33,870 文件。
