metadata:
  name: slackware
info:
  description: Slackware Linux 官方软件包与源代码
  upstream: rsync://ftp.nluug.nl/slackware/
sync:
  type: rsync
  interval: 6h
  timeout: 24h
  nodeSelector:
    kubernetes.io/hostname: s1.mirrors.zjusct.io
storage:
  size: 512Gi
publish:
  http:
    tier: small
    replicas: 1
comment:
  official:
    surveyed_at: '2026-11-21'
    docs:
    - https://mirrors.slackware.com/guidelines/
    - https://mirrors.slackware.com/mirrorlist/
    policy:
    - 官方 Mirroring Guidelines 明确允许公开匿名拉取完整 /slackware/ 树（不含 ISO），现有 rsync 模板参数（--delete、--no-o --no-g、--safe-links）与官方示例兼容。
    - 官方主站 ftp.slackware.com/slackware IPv6 不通且 IPv4 dry-run 第 26s 出现 Connection reset by peer (104)，选用官方镜像列表中的荷兰 NLUUG 学术网 IPv6 上游。
    - 完整树在 s1 实测总计 199,311 个文件 / 112.92G，现有 512Gi 存储充裕；同步周期按原候选设为 6h。
  upstreams:
  - url: rsync://ftp.nluug.nl/slackware/
    surveyed_at: '2026-11-21'
    status: selected
    note: 官方镜像列表荷兰学术网源（IPv6 -6 可达）；s1 dry-run 8s（+1 / 1.98M / 0 删除），66M .txz 实测 15.23 MB/s。
  - url: rsync://slackware.uk/slackware/
    surveyed_at: '2026-11-21'
    status: verified-backup
    note: 备用 IPv6 源；dry-run 11s（0 删除），66M .txz 实测 10.54 MB/s。
  - url: rsync://ftp.slackware.com/slackware/
    surveyed_at: '2026-11-21'
    status: failed
    note: IPv6 超时，IPv4 dry-run 26s 触发 Connection reset by peer (104)。
