metadata:
  name: linuxmint
info:
  description: Linux Mint 发行版软件包仓库
  upstream: rsync://rsync-packages.linuxmint.com/packages/ # Linux Mint 官方指定的软件包同步入口
sync:
  type: rsync
  ipv6: false
  interval: 12h
  timeout: 12h
storage:
  size: 100Gi
  volumeName: pvc-70ca2386-d701-4b7b-862c-6d20063f7328
publish:
  http:
    tier: small
    replicas: 1
comment:
  official:
    surveyed_at: 2026-09-18
    docs:
      - https://linuxmint.com/mirrors.php
    policy:
      - Linux Mint 软件包仓库应从 rsync-packages.linuxmint.com::packages 同步，官方要求每日同步两次，估计占用约 50GB。
      - 软件包仓库与 ISO 镜像归档相互独立；ISO 归档使用 pub.linuxmint.com::pub，每日同步一次。
      - 按要求完成同步后，应发送邮件至 root@linuxmint.com 登记镜像。
  upstreams:
    - url: rsync://rsync-packages.linuxmint.com/packages/
      stack: ipv4
      surveyed_at: 2026-09-18
      metrics: IPv4 RTT 约 257ms
      note: 官方指定的匿名 rsync 同步入口；仅提供 packages 模块，无额外 MOTD 或访问限制。
