metadata:
  name: trisquel
info:
  description: 完全由自由软件组成的 Trisquel GNU/Linux 软件包仓库
  upstream: rsync://rsync.mirrors.ustc.edu.cn/trisquel/
sync:
  type: rsync
  interval: 24h
  timeout: 24h
  nodeSelector:
    kubernetes.io/hostname: s1.mirrors.zjusct.io
storage:
  size: 4816Gi
publish:
  http:
    tier: small
    replicas: 1
comment:
  official:
    surveyed_at: '2026-10-02'
    docs:
    - https://trisquel.info/en/wiki/mirroring-trisquel
    policy:
    - USTC .info 与官方 .org 当前解析同IP；完整APT包树，大体积2.35TiB。
    - 官方2026-08建议包库4TB空间，文档未给频率；不将.iso模块与包库合并。
  bootstrap:
    note: 用户已通知 USTC；初始放行由会话按并发上限控制。官方源可行时验证后切换，否则先记录阻塞，不擅自改写内容。
    official_interval_candidate: 6h
  upstreams:
  - url: rsync://rsync.mirrors.ustc.edu.cn/trisquel/
    surveyed_at: '2026-10-02'
    status: selected
    note: USTC 首次初始化源；容量 2.35 TiB 为站点报告值，非实际占用保证。
  - url: rsync://rsync.trisquel.org/trisquel.packages/
    surveyed_at: '2026-10-02'
    note: 官方或项目认可的后续调查入口；只有验证协议、范围、签名和完整性后才能切换。
