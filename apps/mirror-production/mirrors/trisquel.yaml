metadata:
  name: trisquel
info:
  description: 完全由自由软件组成的 Trisquel GNU/Linux 软件包仓库
  upstream: rsync://mirror.csclub.uwaterloo.ca/trisquel/packages/
sync:
  type: rsync
  interval: 24h
  timeout: 24h
  nodeSelector:
    kubernetes.io/hostname: s1.mirrors.zjusct.io
storage:
  size: 4816Gi
publish:
  http:
    tier: small
    replicas: 1
comment:
  official:
    surveyed_at: '2026-10-02'
    docs:
    - https://trisquel.info/en/wiki/mirroring-trisquel
    policy:
    - USTC .info 与官方 .org 当前解析同IP；完整APT包树，大体积2.35TiB。
    - 官方2026-08建议包库4TB空间，文档未给频率；不将.iso模块与包库合并。
  upstreams:
  - url: rsync://mirror.csclub.uwaterloo.ca/trisquel/packages/
    stack: dual
    status: selected
    surveyed_at: '2026-11-21'
    metrics: IPv6 RTT 271.7ms、ISO 同主机单流 5.57MB/s
    note: '加拿大滑铁卢大学 CSClub 镜像；2026-11-21 实测根目录 14 项与本地 1:1 一致，Packages 更新至 2026-11-19，走 IPv6（-6）。'
  - url: rsync://rsync.mirrors.ustc.edu.cn/trisquel/
    surveyed_at: '2026-11-21'
    status: bootstrap-complete
    note: USTC 首次初始化源；现已切至 mirror.csclub.uwaterloo.ca。
  - url: rsync://rsync.trisquel.org/trisquel.packages/
    stack: ipv4
    status: too-slow
    surveyed_at: '2026-11-21'
    metrics: 仅 IPv4（73.249.29.27），实测约 142KB/s
    note: 官方主站无 AAAA 记录且单流仅约 142KB/s。
