metadata:
  name: knoppix
info:
  description: 基于 Debian 的 Live Linux 发行版 KNOPPIX
  upstream: rsync://rsync.mirrors.ustc.edu.cn/knoppix/
sync:
  type: rsync
  interval: 24h
  timeout: 24h
  nodeSelector:
    kubernetes.io/hostname: s1.mirrors.zjusct.io
storage:
  size: 16Gi
publish:
  http:
    tier: small
    replicas: 1
comment:
  official:
    surveyed_at: '2026-10-03'
    docs:
    - https://www.knopper.net/knoppix-mirrors/index-en.html
    - https://www.knopper.net/knoppix/
    policy:
    - KNOPPIX 官方镜像表明确列出 `rsync CD` 与 `rsync DVD`，ftp.uni-kl.de 为带 *) 的推荐 master site for mirrors；CD 和 DVD 是两个独立模块。
    - 本次官方 `rsync://ftp.uni-kl.de/knoppix/` 根列表成功，但文件/目录时间多为 2021-02-19；列表新鲜度显著落后当前日期，不能直接据连通性宣布官方 cutover 可用。
    - CD 树含 ISO、`.md5/.sha1/.sha256` 及对应 `.asc` 签名文件，并有 `DVD` 绝对/相对模块链接；切换前需核对链接边界和签名。
    - 未找到官方固定同步周期；当前 24h 是本地排程候选，不是官方要求。
  bootstrap:
    note: USTC 首次同步于 2026-10-03T01:11:24Z UTC 成功，发布于 2026-10-03T01:11:33Z UTC；当前 mirrors.zjusct.io/sync-paused=true，自动同步保持暂停。USTC
      初始化成功，但官方 rsync 当前列表看起来停留在 2021；维持暂停，先核实 master 的同步状态和删除集合，不能用陈旧官方源覆盖 USTC 较新树。
  upstreams:
  - url: rsync://rsync.mirrors.ustc.edu.cn/knoppix/
    surveyed_at: '2026-10-03'
    status: selected
    note: USTC 首次同步源；站点报告容量 6.84 GiB，不是实际占用保证。
  - url: rsync://ftp.uni-kl.de/knoppix/
    surveyed_at: '2026-10-03'
    note: 官方或项目认可的后续候选；尚未切换，先验证协议、范围、新鲜度、签名与删除集。
