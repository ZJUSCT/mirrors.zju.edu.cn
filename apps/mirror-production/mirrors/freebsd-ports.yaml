metadata:
  name: freebsd-ports
info:
  description: FreeBSD Ports 构建所需的源码下载缓存
  upstream: rsync://rsync.mirrors.ustc.edu.cn/freebsd-ports/
sync:
  type: rsync
  interval: 24h
  timeout: 24h
  nodeSelector:
    kubernetes.io/hostname: s1.mirrors.zjusct.io
storage:
  size: 632Gi
publish:
  http:
    tier: small
    replicas: 1
comment:
  official:
    surveyed_at: '2026-10-02'
    docs:
    - https://docs.freebsd.org/en/books/porters-handbook/makefiles/
    - http://distcache.freebsd.org/ports-distfiles/
    policy:
    - 2026-10-04 首次同步期间只读检查工作卷根确认包含 .by-hash/、distfiles/、ports.git/ 和 ports.tar.gz（104116814字节）；旧“仅distfiles、不是Git树”判断不完整，必须保留这四项种子范围。
    - 日志已写入 ports.git/objects/pack/、packed-refs 及 2026Q3/2026Q4/main refs；尚未完成引导，Git完整性、tar生成方式及.by-hash关联待成功后的必需复核，不能把当前观察标记为同步后验收通过。
    - 官方 HTTP 本机403、HTTPS证书域名不匹配，未证实官方可用 rsync；不为探测关闭证书校验。
  bootstrap:
    note: 用户已通知 USTC；初始放行由会话按并发上限控制。官方源可行时验证后切换，否则先记录阻塞，不擅自改写内容。
    official_interval_candidate: 24h
  upstreams:
  - url: rsync://rsync.mirrors.ustc.edu.cn/freebsd-ports/
    surveyed_at: '2026-10-02'
    status: selected
    note: USTC 首次初始化源；容量 315.23 GiB 为站点报告值，非实际占用保证。
  - url: http://distcache.freebsd.org/ports-distfiles/
    surveyed_at: '2026-10-02'
    note: 仅为distfiles分支的官方调查入口；尚未证明能覆盖当前种子的.by-hash、ports.git和ports.tar.gz，不能直接作为整个镜像的等价续同步根。需引导成功后补齐各组成部分的来源、生成/链接关系及完整性复核。
