metadata:
  name: netbsd
info:
  description: NetBSD 操作系统发布归档
  upstream: rsync://mirror.planetunix.net/NetBSD/
sync:
  type: rsync
  interval: 24h
  timeout: 24h
  ipv6: true
storage:
  size: 1092Gi
publish:
  http:
    tier: small
    replicas: 1
  aliases:
  - /NetBSD
comment:
  official:
    surveyed_at: '2026-11-08'
    docs:
    - https://www.netbsd.org/mirrors/
    - https://cdn.netbsd.org/pub/NetBSD/README
    - https://rsync.NetBSD.org/
    - https://rsync3.jp.NetBSD.org/pub/NetBSD/
    policy:
    - 官方镜像页列出主站、JAIST、PlanetUnix 等 rsync 镜像；未规定固定同步间隔，采用本地24h策略。
    - 官方 CDN README 描述 pub/NetBSD 下的 NetBSD-10.x/11.x、NetBSD-current、NetBSD-daily、release 快照、images、misc、packages、security、torrent
      等目录；同步保留完整目录树、符号链接和硬链接。
    - 主站 max connections (24) 表示连接数已满；JAIST 下载缓慢，改用 PlanetUnix，通过 IPv6 同步。
    - CDN 用于二进制下载和发布目录参考；整站同步使用 rsync，保持现有目录范围。
  upstreams:
  - url: rsync://mirrors.tuna.tsinghua.edu.cn/NetBSD/
    stack: dual
    status: bootstrap-complete
    surveyed_at: '2026-10-03'
    note: 已完成初始化，共1,805,669个文件，逻辑大小918.91G、传输734.09G。
  - url: rsync://rsync.NetBSD.org/NetBSD/
    stack: dual
    status: temporarily-unavailable
    surveyed_at: '2026-11-08'
    note: IPv4、IPv6 均返回 max connections (24)。
  - url: https://cdn.netbsd.org/pub/NetBSD/
    stack: dual
    status: reference
    surveyed_at: '2026-10-03'
    note: 发布目录及 README 参考。
  - url: rsync://rsync3.jp.NetBSD.org/pub/NetBSD/
    stack: dual
    status: previous
    surveyed_at: '2026-11-08'
    note: 下载缓慢，IPv4 约19KiB/s、IPv6 约27KiB/s，改用 PlanetUnix。
    validated_at: '2026-10-02'
    validation: 同步、快照发布及 HTTP 文件 SHA256 校验通过。
  - url: rsync://mirror.planetunix.net/NetBSD/
    stack: dual
    status: selected
    surveyed_at: '2026-11-08'
    metrics: 同步 Pod 下载约43MiB安装包，单次最多35秒，含连接开销；IPv4 平均0.97–5.28MiB/s，IPv6 约4.70MiB/s。
    validated_at: '2026-11-08'
    validation: 双栈下载成功，顶层名称覆盖 JAIST；11.1 的 amd64、evbmips-mips64eb 文件清单、大小和时间戳抽查与 JAIST 一致。
