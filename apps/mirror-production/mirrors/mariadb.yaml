metadata:
  name: mariadb
info:
  description: MariaDB 关系数据库与连接器发布文件
  upstream: rsync://mirrors.xtom.com.hk/mariadb/
sync:
  type: rsync
  interval: 6h
  timeout: 24h
  nodeSelector:
    kubernetes.io/hostname: s1.mirrors.zjusct.io
storage:
  size: 2Ti
publish:
  http:
    tier: small
    replicas: 1
comment:
  official:
    surveyed_at: '2026-10-04'
    docs:
    - https://mariadb.com/docs/server/clients-and-utilities/server-client-software/download/mirror-sites-for-mariadb
    - https://mariadb.org/download/?t=mirrors
    policy:
    - 官方文档直接指定两个 primary：rsync.osuosl.org::mariadb 与 mirror.netcologne.de::mariadb，并感谢 OSUOSL 和 NetCologne 提供服务。因此 NetCologne 是官方指定、第三方运营的主分发镜像；实际因实测吞吐与地域延迟选用了 mirmon.mariadb.org 在列学术镜像 mirror.kku.ac.th。
    - 普通发布镜像要求 HTTPS、子目录可列、足够容量/带宽（建议至少100Mbit/s），推荐每6h更新且至少每日两次；低于6h频率时官方建议美国东部时间午夜至06:00更新。本站已配置为 6h，符合官方建议。
    - 官方示例为 rsync -a --partial --delete-after --delay-updates；模块内容直接落到本站/mariadb/根，不额外添加一层mariadb。保留PublicKey、PublicKey_2010、TIME、connector-{c,java,nodejs,odbc,python}-*、mariadb-*、repo/、yum/、zoneinfo/，不能仅同步某版服务器或忽略连接器。
    - 官网建议先完成普通release tree初始化再邮件提交信息入镜像列表；这是列表登记步骤，不是公开primary拉取的前置许可。本次没有联系或宣称已入Mirrorbits。mirror.mariadb.org是客户端Mirrorbits分发服务，官方明确不是rsync源，不能以它替代primary。
    - 普通release tree与archive.mariadb.org历史全集不同。官方对archive明确要求预先联系，参考容量约14TB（2025-06），并先比较STATUS避免无变更反复rsync；该限制不能误套到普通primary，也不能用archive替换本次源。官网普通树参考容量约750GB（2025-06），单次发布110–140GB；当前USTC种子约128.27GiB不能证明官方整树等量，2Ti
      PVC也不能证明后端可用空间足够。
    - NetCologne实际daemon MOTD限定每IP最多4个rsync连接，并声明禁用checksum(-c)。切源使用普通大小/mtime dry-run与独立文件哈希验收，不添加-c或并行超过对方限制。
    - 现有rsync模板（--delete、--partial-dir=.rsync-partial）配合 Falcon ZFS 快照隔离发布，无需额外追加 --delete-after 或 --delay-updates。官网两段保留版数表述不完全一致（最新2版/3–4版），应以完整dry-run和实际源树为准，不自己按网页数字清理版本。
  upstreams:
  - url: rsync://mirrors.xtom.com.hk/mariadb/
    surveyed_at: '2026-11-24'
    status: active-verified
    note: 香港 xTom 公开源，mirmon.mariadb.org 状态 3 hours / ok（TIME 2026/11/24 05:30:01）；s1 节点 IPv6（-6）实测 15.4 MiB 文件 3,944 KB/s，树布局与官方一致。
  - url: rsync://mirror.aarnet.edu.au/mariadb/
    surveyed_at: '2026-11-24'
    status: bootstrap-seed
    note: 澳大利亚 AARNet，s1 节点 IPv6（-6）实测 13~40 MiB/s（mirmon 滞后约 18 hours）；2026-11-24 用于快速补齐完整发布树。
  - url: rsync://mirror.kku.ac.th/mariadb/
    surveyed_at: '2026-11-24'
    status: candidate-slow
    note: 泰国孔敬大学公共镜像；虽 mirmon 状态 3 hours / ok，但 2026-11-24 实测长流掉速至 ~85 KB/s 并出现 Connection reset by peer (104)。
  - url: rsync://mirror.netcologne.de/mariadb/
    surveyed_at: '2026-11-21'
    status: candidate-verified-readonly
    note: 官方直接指定的primary，每IP最多4连接、禁用-c；s1节点IPv6（-6）实测7.37MB/s、dry-run 14s。
  - url: rsync://rsync.osuosl.org/mariadb/
    surveyed_at: '2026-11-21'
    status: candidate-slow
    note: 官网直接指定的另一个primary；s1节点IPv6（-6）dry-run 41s、99.4MB单文件30s超时。
  - url: rsync://rsync.mirrors.ustc.edu.cn/mariadb/
    surveyed_at: '2026-10-04'
    status: retired-seed
    note: USTC初始化种子（仅含约166G部分子集），2026-11-21已迁移出。
  verification:
    surveyed_at: '2026-11-21'
    checks:
    - 官网镜像指南和Foundation mirmon.mariadb.org HTTP 200；2026-11-21在s1节点验证kku/aarnet/nluug/netcologne/osuosl均可经IPv6(-6)连通，树规模一致为49,263文件/832.32G。
    - s1节点与现有mariadb-sync（166G已用/1.9T可用）进行完整--dry-run，mirror.kku.ac.th耗时9s、新增17,076文件（645.77G）、删除0文件，可容纳在2Ti卷内。
