metadata:
  name: kali-images
info:
  description: Kali Linux 安装、Live 与虚拟机镜像
  upstream: rsync://mirror.twds.com.tw/kali-images/ # 官方镜像列表收录的台湾节点；主源需注册后开放访问
sync:
  type: rsync
  interval: 24h
  timeout: 24h
storage:
  size: 300Gi
  volumeName: pvc-c0742030-a8d0-49cb-bf9e-0abe272526a5
publish:
  http:
    tier: standard
    replicas: 1
comment:
  official:
    surveyed_at: 2026-09-18
    docs:
      - https://www.kali.org/docs/community/kali-linux-mirrors/
      - https://www.kali.org/docs/community/setting-up-a-kali-linux-mirror/
      - https://cdimage.kali.org/README?mirrorlist
    policy:
      - Kali 将软件包仓库与预构建镜像仓库分开发布；后者使用 kali-images 模块和 cdimage.kali.org 重定向服务。
      - 镜像仓库不使用推送同步，官方要求每日 rsync 一次，并调整具体分钟以避免集中访问主源。
      - 官方镜像须使用静态 IP，提供 HTTP 和 rsync 服务并开放 SSH；HTTPS 可选，且 HTTP 不得重定向至 HTTPS。
      - 申请加入官方镜像列表后，Kali 才会开放 archive.kali.org 的 rsync 访问；未获授权时应从公共镜像同步。
  upstreams:
    - url: rsync://mirror.twds.com.tw/kali-images/
      stack: dual
      surveyed_at: 2026-09-18
      metrics: IPv4 RTT 约 85ms、36MiB/s；IPv6 RTT 约 84ms、38MiB/s
      note: Kali 官方镜像列表收录的台湾节点；MOTD 提示异常连接可能被封禁，无其他访问限制。
    - url: rsync://archive.kali.org/kali-images/
      stack: dual
      surveyed_at: 2026-09-18
      metrics: IPv4 RTT 约 291ms；IPv6 RTT 约 252ms；rsync 未获授权并超时
      note: 官方镜像脚本的默认主源；需邮件申请加入镜像列表，由 Kali 开放源站 rsync 访问。
