metadata:
  name: cachyos
info:
  description: CachyOS 的安装镜像和官方软件包仓库
  upstream: rsync://mirror.zyner.org/cachyos/ # CachyOS 官方列表 Tier-1 瑞典镜像（原生 IPv6）
sync:
  type: rsync
  interval: 6h
  timeout: 24h
  nodeSelector:
    kubernetes.io/hostname: s1.mirrors.zjusct.io
storage:
  size: 388Gi
publish:
  http:
    tier: small
    replicas: 1
comment:
  official:
    surveyed_at: '2026-11-21'
    docs:
    - https://raw.githubusercontent.com/CachyOS/CachyOS-PKGBUILDS/master/cachyos-mirrorlist/cachyos-mirrorlist
    - https://github.com/CachyOS/wiki/blob/1803ac4541cf46059b37f8005b1211791e3a8bb3/src/content/docs/policy/repository_policy.md
    policy:
    - 官方 Repository Usage Policy 第 8 节允许第三方通过 rsync/syncthing 镜像并提供 HTTP/HTTPS 服务，前提是仓库数据保持原样不改动。
    - 官方主站域名（mirror.cachyos.org 已注释禁用、at.cachyos.org、us.cachyos.org、cdn77.cachyos.org）均不开放公开匿名 rsync（873 端口超时），官方对新镜像站常规要求联系团队通过 Syncthing 配对。
    - 本条目采用官方 cachyos-mirrorlist 中的 Tier-1 公开 rsync 镜像，完整保留 ISO/、repo/（x86_64/x86_64_v3/x86_64_v4/znver4）、.theme/、Nginx-Fancyindex-Theme-light/、.stfolder/ 及根目录工具包并发布到 /cachyos/。
  upstreams:
  - url: rsync://mirror.zyner.org/cachyos/
    stack: dual
    surveyed_at: '2026-11-21'
    status: selected
    metrics: 's1 IPv6 实测 8.29–9.63 MB/s；cachyos-v3.db.tar.zst 更新至 2026-11-21T08:20:03Z；dry-run 完成（49,906 文件 / 194.24 GiB，新增 +2,517 / 38.29 GiB，清理 2,518）'
    note: '官方 cachyos-mirrorlist 瑞典 Tier-1 镜像，原生 IPv6 与目录结构均与本地一致；6h 同步周期满足滚动仓库更新需求。'
  - url: rsync://mirror.init7.net/cachyos/
    stack: dual
    surveyed_at: '2026-11-21'
    status: candidate-backup
    metrics: 's1 IPv6 实测 9.98–10.57 MB/s；cachyos-v3.db.tar.zst 2026-11-21T08:20:03Z；dry-run 49,924 文件 / 194.61 GiB'
    note: '官方列表瑞士 Tier-2 镜像，有明确公开下游镜像 fair-use 条款，可作高可用备用。'
  - url: rsync://ca.mirror.cx/cachyos/
    stack: dual
    surveyed_at: '2026-11-21'
    status: rejected
    metrics: 'IPv6 6.73–8.13 MB/s；cachyos-v3.db.tar.zst 停在 2026-11-20T20:41:13Z'
    note: '同步时间滞后约半天，同系列 no.mirror.cx (0.7–1.0 MB/s) 与 nl.mirror.cx (765–822 KB/s) 链路偏慢。'
  - url: rsync://rsync.mirrors.ustc.edu.cn/cachyos/
    surveyed_at: '2026-10-04'
    status: rejected
    note: '历史初始化源；近期频繁触发 rsync-proxy Server queue is full 导致索引滞后，现已切离。'
