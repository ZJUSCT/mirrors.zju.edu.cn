metadata:
  name: armbian-releases
info:
  description: Armbian 单板计算机系统镜像
  upstream: rsync://rsync.armbian.com/dl/ # Armbian 官方 dl 模块（ipv6: false 避开失效/低速 IPv6 节点）
sync:
  type: rsync
  ipv6: false # 2605:6400:: 873 超时、2001:bb8:: 仅 ~500 KB/s，不传 -6 由双栈优先走 IPv4
  interval: 4h
  timeout: 24h
  nodeSelector:
    kubernetes.io/hostname: s1.mirrors.zjusct.io
storage:
  size: 1Ti
publish:
  http:
    tier: small
    replicas: 1
comment:
  official:
    surveyed_at: '2026-11-21'
    docs:
    - https://docs.armbian.com/contribute/run-a-mirror/
    - https://docs.armbian.com/status/mirrors/
    policy:
    - 官方要求镜像提供可访问的 HTTPS（也接受 HTTP）主机，并从官方 rsync.armbian.com/dl 模块每 2–4 小时同步一次。
    - 同步追齐并稳定运行后，需通过官方联系表单登记以加入官方 redirector。
    - 本条目只覆盖 dl（全树约 635.83 GiB / 3,168 个文件）；Armbian apt 由独立的 armbian 条目覆盖，不合并。
  upstreams:
  - url: rsync://rsync.armbian.com/dl/
    stack: dual
    surveyed_at: '2026-11-21'
    status: selected
    metrics: 's1 实测 3 个 IPv4 全通(185.94.135.238 6.77 MB/s, 23.186.113.5 6.99 MB/s, 193.40.103.61 4.12 MB/s)；IPv6 中 2605:6400:: 873 超时、2001:bb8:: 仅 514 KB/s；dry-run 51s 完成（3,168 文件 / 635.83 GiB）'
    note: '官方指定源；配置 ipv6: false 去掉 -6 后 3/3 次探测均正常连接，周期调整为 4h 对齐官方要求；切换追齐需补传 +542 文件/193.36 GiB 并清理 432 个过期镜像。'
  - url: rsync://mirror.aarnet.edu.au/armbian-dl/
    stack: dual
    surveyed_at: '2026-11-21'
    status: rejected
    metrics: 'IPv6 实测 51.5–73.1 MB/s，但最新镜像停留在 2026-08-22 (Armbian_26.8.3)'
    note: '内容比官方滞后约 3 个月（缺少 26.11.2），不予采用。'
  - url: rsync://mirrors.dotsrc.org/armbian-dl/
    stack: dual
    surveyed_at: '2026-11-21'
    status: rejected
    metrics: 'IPv6 873 可连，但 10s 内未进入有效传输即超时'
    note: '连接吞吐过慢，不予采用。'
  - url: rsync://rsync.mirrors.ustc.edu.cn/armbian-dl/
    surveyed_at: '2026-10-02'
    status: rejected
    note: '历史初始化源；近期同步频繁触发 rsync-proxy Server queue is full，现已切回官方 dl 源。'
