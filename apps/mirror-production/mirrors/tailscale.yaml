metadata:
  name: tailscale
info:
  description: Tailscale 组网工具的 Linux 软件包
  upstream: rsync://rsync.mirrors.ustc.edu.cn/tailscale/
sync:
  type: rsync
  interval: 24h
  timeout: 24h
  nodeSelector:
    kubernetes.io/hostname: s1.mirrors.zjusct.io
storage:
  size: 68Gi
publish:
  http:
    tier: small
    replicas: 1
comment:
  official:
    surveyed_at: '2026-10-03'
    docs:
    - https://pkgs.tailscale.com/stable/
    - https://tailscale.com/kb/1031/install-linux
    policy:
    - 官方 stable 页面是多平台安装说明，不是通用目录列表；当前已发布根仅有 debian/ 与 ubuntu/，必须保留这个子集及既有发行版/架构范围，不扩展为整个 stable 站点。
    - 官方 Debian trixie 说明使用独立 keyring 与 signed-by；保留官方签名元数据、索引、包、密钥及源配置文件，不改写或重签。官方样本 InRelease 的 gpgv 校验通过，trixie/amd64 Packages
      的大小与 SHA-256 匹配签名元数据；本次未验证所有架构或 USTC 快照内容。
    - 未在本轮官方文档发现固定镜像同步周期；现有 24h 是本地选择。
  bootstrap:
    note: USTC 首次同步任务 tailscale-sync-1791014293 于 2026-10-03T08:48:48Z 成功，快照 tailscale-snap-1791014293 于 2026-10-03T09:12:38Z
      发布，Ready=True；自动同步保持暂停。这不是官方切换完成。
    official_cutover_blocker: 官方 stable 根返回 200 但为安装说明页；debian/ 与 ubuntu/ 目录返回 404，而已知 InRelease、Packages、密钥和源配置 URL 返回 200。本机
      tsumugu 0.20260921.0 的 nginx 与 fallback 目录解析实测均退出 3；--apt-packages 仅处理已枚举的 Packages，不能发现此源的 APT 元数据入口。当前 rsync/ftpsync/qfm
      模板不能直接读取 HTTPS APT 根，且没有本轮验证通过的官方 rsync 源。
    action: 保留成功发布的 USTC 快照及暂停状态，不新增同步类型，不恢复 USTC 定时同步；待官方可枚举入口或另行授权的 APT 枚举能力可用后，完整核对 Debian/Ubuntu 范围、签名和删除集再切换。
  upstreams:
  - url: rsync://rsync.mirrors.ustc.edu.cn/tailscale/
    surveyed_at: '2026-10-03'
    status: selected
    note: 仅为已完成的首次同步源；本轮未连接 USTC rsync，保留已发布快照。
  - url: https://pkgs.tailscale.com/stable/
    surveyed_at: '2026-10-03'
    status: blocked-by-existing-template
    note: 官方 stable 入口；已知 APT 文件可访问且 trixie/amd64 样本信任链通过，但目录枚举实际失败，现有模板不能完整同步既有 Debian/Ubuntu 子集。不得从本次单发行版样本推断全范围完整性。
