metadata:
  name: neurodebian
info:
  description: 面向神经科学研究的 Debian 软件仓库与虚拟机镜像
  upstream: rsync://mirror.aarnet.edu.au/neurodebian/
sync:
  type: rsync
  interval: 6h
  timeout: 24h
  # WaitForFirstConsumer 首次落盘到 s1；PVC 绑定后可移除此选择器。
  nodeSelector:
    kubernetes.io/hostname: s1.mirrors.zjusct.io
storage:
  size: 160Gi
publish:
  http:
    tier: small
    replicas: 1
comment:
  official:
    surveyed_at: '2026-10-03'
    docs:
    - https://neuro.debian.net/faq.html
    policy:
    - 官方 FAQ 明确仓库可用 rsync 镜像，并要求镜像赞助者联系项目；候选模块为 rsync://neuro.debian.net/neurodebian/。
    - FAQ 标出仓库签名密钥 0x439754ED1F42AA2C；根列表显示 .timestamp、dists/、extracts/、pool/、vm/，应保持这些范围和 APT 元数据边界。
    - 未查到官方固定同步周期；6h 是本站本地排程候选，不是官方要求。
  bootstrap:
    status: migrated-from-ustc
    job: neurodebian-sync-1790954927
    succeeded_at: '2026-10-02T19:39:35Z'
    published_at: '2026-10-02T19:39:45Z'
    note: 2026-10-02由USTC初始化成功并发布；2026-11-22切换至 rsync://mirror.aarnet.edu.au/neurodebian/（保留 -6，interval=6h）。
  upstreams:
  - url: rsync://mirror.aarnet.edu.au/neurodebian/
    surveyed_at: '2026-11-22'
    status: active-verified
    note: 澳大利亚 AARNet 公共镜像；s1 节点 IPv6(-6) 测速 3.15MB/s，完整 dry-run 37s（28,586 文件 / 84.95G，0 新增，0 删除，仅同步 11B .timestamp）。
  - url: rsync://neuro.debian.net/neurodebian/
    surveyed_at: '2026-11-22'
    status: candidate-ipv4-no-dryrun
    note: 官方主站无 IPv6、IPv4 测速 1.67MB/s 且服务器拒绝 --dry-run (-n)。
  - url: rsync://rsync.mirrors.ustc.edu.cn/neurodebian/
    surveyed_at: '2026-10-03'
    status: retired-seed
    note: USTC 初始化种子；2026-11-22 已迁移至 mirror.aarnet.edu.au。
  verification:
    surveyed_at: '2026-11-22'
    checks:
    - 2026-11-22 在 s1.mirrors.zjusct.io 对只读挂载的 neurodebian-sync（76G 已用 / 85G 可用）执行 IPv6(-6) dry-run 耗时 37s 退出 0：28,586 文件 / 84.95G，0 新增、0 删除。
