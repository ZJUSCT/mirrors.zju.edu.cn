metadata:
  name: endeavouros
info:
  description: EndeavourOS 软件仓库与安装镜像
  upstream: rsync://mirror.alpix.eu/endeavouros/
sync:
  type: rsync
  interval: 24h
  timeout: 24h
storage:
  size: 140Gi
publish:
  http:
    tier: small
    replicas: 1
comment:
  official:
    surveyed_at: '2026-10-03'
    docs:
    - https://raw.githubusercontent.com/endeavouros-team/PKGBUILDS/master/endeavouros-mirrorlist/endeavouros-mirrorlist
    - https://mirror.alpix.eu/endeavouros/
    - https://endeavouros.com/
    policy:
    - EndeavourOS 官方 mirrorlist 将 mirror.alpix.eu 列为 Germany 镜像，正式客户端 URL 是 https://mirror.alpix.eu/endeavouros/repo/$repo/$arch；这是
      repo 服务路径，不应只同步 repo 而丢掉 iso。
    - mirror.alpix.eu/endeavouros 的公开 HTTPS 与 rsync 根均包含 iso/、repo/、README.txt、synctrace.txt；synctrace 明确记录 Tier
      0 EndeavourOS whitelist rsync master server 与 Tier 1 mirror.alpix.eu，证明其为官方白名单镜像。TUNA 根与之四项同名。
    - 官方 mirrorlist 没有写强制同步间隔；采用 24h 保守周期。synctrace 是上游追踪证据，不是频率承诺。
    - 保留 repo 数据库/签名、iso 校验文件和 synctrace；恢复前对完整根执行 IPv6 rsync dry-run，并检查 repo/endeavouros、repo/core 等实际路径。
  upstreams:
  - url: rsync://mirrors.tuna.tsinghua.edu.cn/endeavouros/
    stack: dual
    status: bootstrap-complete
    surveyed_at: '2026-10-03'
    note: 当前初始化源；根目录 iso/repo/README.txt/synctrace.txt 与官方候选同名。
  - url: rsync://mirror.alpix.eu/endeavouros/
    stack: ipv6
    status: selected
    surveyed_at: '2026-10-03'
    note: 官方 mirrorlist 列出的镜像；其 synctrace 记录 Tier 0 EndeavourOS whitelist rsync master 和 Tier 1 mirror.alpix.eu，IPv6
      list-only 成功。
    validated_at: '2026-10-02'
    validation: 生产真实同步、快照发布与 HTTP 文件 SHA256 校验通过。note 中的探测说明保留为切源前调查记录。
  bootstrap:
    note: TUNA 初始化、官方源只读 dry-run、真实回源、快照发布及公开 HTTP 文件 SHA256 校验均已通过；已满足恢复自动同步条件。
    reported_size: 86.4G
