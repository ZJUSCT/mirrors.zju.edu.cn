metadata:
  name: epel-archive
info:
  description: EPEL 7 软件包归档（保留 USTC 现有架构与目录范围）
  upstream: rsync://ftp-stud.hs-esslingen.de/fedora-archive/epel/./7/
sync:
  type: rsync
  interval: 24h
  timeout: 24h
  nodeSelector:
    kubernetes.io/hostname: s1.mirrors.zjusct.io
  rsync:
    extra_args:
      - -R
      - --include=/7/
      - --include=/7/aarch64/***
      - --include=/7/source/***
      - --include=/7/SRPMS
      - --include=/7/SRPMS/***
      - --include=/7/x86_64/***
      - --include=/7/state
      - --exclude=*
storage:
  size: 160Gi
publish:
  http:
    tier: small
    replicas: 1
comment:
  official:
    surveyed_at: '2026-10-07'
    docs:
    - https://docs.fedoraproject.org/en-US/epel/epel-faq/
    - https://archives.fedoraproject.org/pub/archive/epel/7/
    - https://fedoraproject.org/wiki/Infrastructure/Mirroring
    - https://fedoraproject.org/wiki/Infrastructure/Mirroring/Tiering
    policy:
    - 本项仅保留USTC现有EPEL7子集，不是完整EPEL历史全集。2026-10-04获准的两次HTTP目录元数据读取确认：/epel-archive/仅含7/，/epel-archive/7/含aarch64/、source/、SRPMS/、x86_64/及58字节state；公开路径保持/epel-archive/7/<架构>/。
    - 官方/pub/archive/epel/7/还包含ppc64/、ppc64le/，种子未展示这些目录；已配置 --include 白名单仅保留 aarch64/、source/、SRPMS、x86_64/、state，不自动加入新架构。
    - 现有rsync模板通过 extra_args 传入 -R 与白名单即可保持同范围（2026-11-21 在 s1 节点 IPv6(-6) dry-run 34s：40,105 文件 / 87.89G，0 新增，0 删除），无需增加新同步类型。
  upstreams:
  - url: rsync://ftp-stud.hs-esslingen.de/fedora-archive/epel/./7/
    surveyed_at: '2026-11-21'
    status: active-verified
    note: Fedora Tier1 运营方；s1 节点 IPv6(-6) 测速 4.29MB/s，带 -R 与 7/{aarch64,source,SRPMS,x86_64,state} 白名单完整 dry-run 34s（40,105 文件 / 87.89G，0 删除）。
  - url: rsync://rsync.mirrors.ustc.edu.cn/epel-archive/
    surveyed_at: '2026-10-07'
    status: retired-seed
    note: USTC 初始化种子；2026-11-21 已迁移至 Esslingen。
  verification:
    surveyed_at: '2026-11-21'
    checks:
    - 2026-11-21 在 s1.mirrors.zjusct.io 对只读挂载的 epel-archive-sync（72G 已用 / 89G 可用）执行 IPv6(-6) -R 白名单 dry-run，34s 退出 0：40,105 文件 / 87.89G，0 新增、0 删除。
