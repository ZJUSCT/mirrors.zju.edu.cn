    - 2026-11-21在 s1.mirrors.zjusct.io 对只读挂载的 nginx-sync（222G 已用 / 255G 可用）执行 tsumugu sync --dry-run --parser nginx --threads 8 --max-delete 100 https://nginx.org/packages/ /data/，81s 退出 0：扫描 131,417 对象（230.14GiB），Skipping 130,038，Listing 1,417，需下载 0、需删除 0。
    - curl -6 验证官方源 IPv6 HTTP 200 可达（2a05:d014:5c0:2600::6），单文件 8.74MB 下载 2.54MB/s。
