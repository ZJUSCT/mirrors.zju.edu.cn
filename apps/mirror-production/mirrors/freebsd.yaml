metadata:
  name: freebsd
info:
  description: FreeBSD 的安装镜像和系统发布文件
  upstream: rsync://mirror.aarnet.edu.au/freebsd/ # FreeBSD 官方列表站点 ftp.au.FreeBSD.org（AARNet）
sync:
  type: rsync
  interval: 24h
  timeout: 24h
  nodeSelector:
    kubernetes.io/hostname: s1.mirrors.zjusct.io
  rsync:
    extra_args:
      # 仅镜像正式发布与文档兼容树（doc/、ports/、releases/），排除开发树和每日快照，与现有 604Gi 卷范围保持一致。
      - --exclude=/development/
      - --exclude=/snapshots/
storage:
  size: 604Gi
publish:
  http:
    tier: small
    replicas: 1
comment:
  official:
    surveyed_at: '2026-11-21'
    docs:
    - https://docs.freebsd.org/en/articles/hubs/
    - https://docs.freebsd.org/en/books/handbook/mirrors/
    - https://www.freebsd.org/where/
    policy:
    - FreeBSD 官方 Mirroring 文档推荐对 FTP 发行树使用 rsync（示例 -vaHz --delete），每日至少同步一次（24h 符合建议），并预留 10–20% 磁盘余量。
    - 官方明确不再新增 community mirror 登记，不宣称本站为官方登记节点；官方 download.FreeBSD.org 仅走 Fastly HTTP/FTP，不提供匿名 rsync，且树内含约 499 个软链接与硬链接，继续沿用 rsync 同步。
    - 保留完整发行布局（doc/、ports/、releases/ 及历史版本 ISO/CI/OCI/VM/PKGBASE-REPOS）与根目录 .message/.notar/.stfolder/.stignore/TIMESTAMP/dir.sizes；本条目 ports/ 为历史兼容树，不与独立 freebsd-ports 合并。
  upstreams:
  - url: rsync://mirror.aarnet.edu.au/freebsd/
    stack: dual
    surveyed_at: '2026-11-21'
    status: selected
    metrics: 's1 IPv6 实测 17.92 MB/s（6s 完成 112 MiB bootonly.iso.xz）；TIMESTAMP 2026-11-21T02:00:00 UTC；dry-run 实测全树 3,189 文件 / 468.57 GiB（新增 +531 / 100.11 GiB，清理 144）'
    note: '官方社区镜像列表中 ftp.au.FreeBSD.org 的 DNSSEC CNAME 实体站点（澳洲学术网 AARNet），模块名为小写 freebsd；现有 604Gi 卷留有约 135 GiB 余量。'
  - url: rsync://ftp.kr.freebsd.org/FreeBSD/
    stack: ipv4
    surveyed_at: '2026-11-21'
    status: rejected
    metrics: '无 AAAA 记录（-6 直接解析失败）；IPv4 在 15s 内未完成 112 MiB 传输；TIMESTAMP 2026-11-21T00:00:00 UTC'
    note: '仅有 IPv4 且速度慢于 AARNet。'
  - url: rsync://ftp2.jp.FreeBSD.org/FreeBSD/
    stack: dual
    surveyed_at: '2026-11-21'
    status: rejected
    metrics: 'IPv6 15s 内未完成 112 MiB；TIMESTAMP 滞后在 2026-11-20T00:00:00 UTC'
    note: 'IIJ 节点，速度与新鲜度均不如 AARNet。'
  - url: rsync://ftp6.jp.FreeBSD.org/FreeBSD/
    stack: dual
    surveyed_at: '2026-11-21'
    status: rejected
    note: 'JAIST 节点实测返回 rsync code 5。'
  - url: rsync://ftp4.tw.FreeBSD.org/FreeBSD/
    stack: dual
    surveyed_at: '2026-11-21'
    status: rejected
    note: 'DNS 解析超时不可用。'
  - url: rsync://ftp.halifax.rwth-aachen.de/freebsd/
    stack: dual
    surveyed_at: '2026-11-21'
    status: rejected
    metrics: 'TIMESTAMP 2026-11-21T07:30:00 UTC；IPv6 15s 内未完成 112 MiB'
    note: '与 ftp.se.freebsd.org、mirror.csclub.uwaterloo.ca、ftp.nl.freebsd.org 同测，欧洲/北美链路 15s 内均未完成测试文件（ftp.de.freebsd.org 触发 max connections 20）。'
  - url: rsync://rsync.mirrors.ustc.edu.cn/freebsd/
    surveyed_at: '2026-10-04'
    status: rejected
    note: '历史初始化源；已完成底包引导，现已切往澳洲学术网 AARNet IPv6 源。'
