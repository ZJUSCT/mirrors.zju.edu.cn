metadata:
  name: libreoffice
info:
  description: LibreOffice 开源办公套件发布文件
  upstream: rsync://rsync.documentfoundation.org/tdf-pub/
sync:
  type: rsync
  interval: 6h
  timeout: 24h
  # WaitForFirstConsumer 首次落盘到 s1；PVC 绑定后可移除此选择器。
  nodeSelector:
    kubernetes.io/hostname: s1.mirrors.zjusct.io
storage:
  size: 300Gi
publish:
  http:
    tier: small
    replicas: 1
    # 两端均同步 TDF 根；公开路径 /libreoffice/ 直接呈现套件目录。
    subPath: libreoffice
comment:
  official:
    surveyed_at: '2026-10-03'
    docs:
    - https://wiki.documentfoundation.org/Infra/Mirroring
    policy:
    - Document Foundation 明确公共 rsync 源为 rsync://rsync.documentfoundation.org/tdf-pub/；staging 源需授权，不能用于本次公开镜像。
    - 官方要求镜像同步到顶层 tdf/，保留原目录层级，并提供 HTTPS；公共源建议每 4–8h。镜像登记需向 hostmaster@documentfoundation.org 提交运营者、tdf HTTPS/FTP/rsync URL、联系方式和带宽信息。
    - 官方对 public repository 建议每 4–8h 同步；本站已配置为 6h，符合官方建议。
  upstreams:
  - url: rsync://rsync.documentfoundation.org/tdf-pub/
    surveyed_at: '2026-11-21'
    status: active-verified
    note: 官方公共 daemon；s1 节点 IPv6(-6) 实测 55M .dmg 3.72MB/s（默认模式 25s 超时，必须保留 -6），完整 dry-run 33s（35,554 文件 / 167.31G，+2,516 / 6.69G，0 删除）。
  - url: rsync://rsync.mirrors.ustc.edu.cn/tdf/
    surveyed_at: '2026-10-03'
    status: retired-seed
    note: USTC 初始化种子；2026-11-21 已迁移至官方源。
  verification:
    surveyed_at: '2026-11-21'
    checks:
    - 2026-11-21 在 s1.mirrors.zjusct.io 验证官方 rsync://rsync.documentfoundation.org/tdf-pub/ IPv6(-6) 连通（TIMESTAMP、libreoffice/ 正常），对只读挂载的 libreoffice-sync（137G 已用 / 164G 可用）完整 dry-run 耗时 33s 退出 0：35,554 文件 / 167.31G，0 删除。
    - 本站通过 publish.http.subPath=libreoffice 对外提供 /libreoffice/ 访问；若后续向 TDF 申请加入 MirrorBrain 官方列表，需按官方要求确认 /tdf/ 顶层路径与登记邮件。
