metadata:
  name: winehq
info:
  description: Wine 源码及相关发布文件
  upstream: https://dl.winehq.org/
sync:
  type: tsumugu
  interval: 24h
  timeout: 168h
  nodeSelector:
    kubernetes.io/hostname: s1.mirrors.zjusct.io
  tsumugu:
    parser: apache-f2
    threads: 8
    max_delete: 100
    extra_args:
      - --exclusion-v2
      - --include
      - ^/$
      - --include
      - ^/(wine|mono|other|vkd3d)(/|$)
      - --exclude
      - .
      - --trust-mtime-from-parser
      - --skip-if-exists
      - ^/mono/monolite/
      - --skip-if-exists
      - ^/(wine/(source|wine-gecko|wine-mono|logos)|mono/sources|other|vkd3d/source)/.*\.(tar\.(gz|bz2|xz)|diff\.(gz|bz2|xz)|msi|cab|zip|mp4|rpm|pdf|ps|eps|png|svg|sign)$
storage:
  size: 128Gi
publish:
  http:
    tier: small
    replicas: 1
comment:
  official:
    surveyed_at: '2026-10-03'
    docs:
    - https://wiki.winehq.org/Download
    - https://dl.winehq.org/
    - https://dl.winehq.org/wine/
    - https://dl.winehq.org/wine-builds/
    policy:
    - WineHQ 官方下载页面和 dl.winehq.org 当前目录将发布内容分为 wine/、wine-builds/、mono/、other/、vkd3d；wine/ 下含 docs、logos、source、wine-gecko、wine-mono。
    - TUNA 初始化日志为 3,886 项、3,765 普通文件、约 57.58G，路径均以 wine/ 开始，说明当前条目对应 dl.winehq.org/wine/，不应把已单独部署的 wine-builds/
      合并进来。
    - TUNA 初始化日志中的所有路径均以 `wine/` 开头（3,886 项、3,765 普通文件、约 57.58G），对应旧 FTP `/pub/` 的父目录布局；若把 tsumugu URL 直接设为 https://dl.winehq.org/wine/，其内容根是
      source、docs、logos 等，会把 wine/ 前缀剥掉并改变公开布局。当前通用切源验证器未证明可用父根 https://dl.winehq.org/ 加 include/exclude 保留 wine/
      前缀，因此不能恢复自动同步。
    - 官方没有公开固定同步间隔；Wine 发布和辅助运行时可能不规则，24h 为本站配置建议。
  upstreams:
  - url: https://dl.winehq.org/
    stack: dual
    status: selected
    surveyed_at: '2026-11-24'
    note: 使用 tsumugu/apache-f2（默认 sync.ipv6=true 注入 BIND_ADDRESS="::" 强制 IPv6）直连官方父根保留 wine/、mono/、other/、vkd3d/（排除已独立部署的 wine-builds/）；因 TUNA 存量旧文件与 2025-04 上游 Last-Modified 不一致且 IPv4 严重限速，启用 --trust-mtime-from-parser 避免全量 HEAD 校验，并用 --skip-if-exists 跳过既有历史不可变归档（sha512sums.asc 等可变文件仍按网页时间戳更新），timeout 放宽至 168h。
  - url: rsync://mirrors.tuna.tsinghua.edu.cn/winehq/
    stack: dual
    status: obsolete
    surveyed_at: '2026-11-21'
    note: 因官方 ftp.winehq.org 关停，TUNA/NJU 等国内上游停更在 2025 年 2–3 月（wine-mono 停在 9.4.0、wine/source 停在 10.x）。
  - url: https://dl.winehq.org/wine/
    stack: dual
    status: scope-incompatible
    surveyed_at: '2026-10-03'
    note: 该 URL 内容根为 docs/logos/source/wine-gecko/wine-mono，不能直接写入保留 wine/ 前缀的 TUNA 目标。需验证父根筛选或增加路径映射。
  - url: https://dl.winehq.org/wine-builds/
    stack: dual
    status: excluded
    surveyed_at: '2026-10-03'
    note: 官方同根的另一内容树；不在本次 winehq TUNA 初始化范围，且已有独立 wine-builds 镜像。
  - url: ftp://ftp.winehq.org/pub/
    stack: unresolved
    status: obsolete
    surveyed_at: '2026-10-03'
    note: 计划中的旧 FTP 主机当前 DNS 不可用，不能作为切源。
  bootstrap:
    note: TUNA 初始化已成功完成，当前保持 sync-paused；官方 HTTPS wine/ 内容可读，但直接以 wine/ 为 URL 会丢失 TUNA 既有 wine/ 前缀，父根 include/exclude
      尚未通过通用验证，保持暂停。
    reported_size: 54.5G
