metadata:
  name: videolan-ftp
info:
  description: VideoLAN 多媒体软件及相关编解码工具发布文件
  upstream: rsync://rsync.videolan.org/videolan-ftp/
sync:
  type: rsync
  ipv6: false
  interval: 6h
  timeout: 24h
  # WaitForFirstConsumer 首次落盘到 s1；PVC 绑定后可移除此选择器。
  nodeSelector:
    kubernetes.io/hostname: s1.mirrors.zjusct.io
storage:
  size: 256Gi
publish:
  http:
    tier: small
    replicas: 1
comment:
  official:
    surveyed_at: '2026-10-03'
    docs:
    - https://www.videolan.org/videolan/mirrors.html
    policy:
    - VideoLAN 镜像页说明其 Mirrorbits/赞助镜像基础设施，并要求有意提供镜像者联系 VideoLAN；候选 rsync://rsync.videolan.org/videolan-ftp/。
    - 有界根列表成功，包含 trace、keys 及多个项目目录（如 vlc、x264、x265）；目标是 videolan-ftp 范围，不得误用 videolan-ftp-full 或把 Mirrorbits HTTP 页面当 rsync
      源。
    - 未查到官方固定同步周期；6h 是本站本地排程候选，不是官方要求。
  bootstrap:
    status: migrated-from-ustc
    job: videolan-ftp-sync-1790964749
    succeeded_at: '2026-10-02T21:36:42Z'
    published_at: '2026-10-02T21:36:50Z'
    note: 2026-10-02由USTC初始化成功并发布；2026-11-22切换至官方 rsync://rsync.videolan.org/videolan-ftp/（官方主站 IPv6 超时故设 ipv6=false，interval=6h）。
  upstreams:
  - url: rsync://rsync.videolan.org/videolan-ftp/
    surveyed_at: '2026-11-22'
    status: active-verified
    note: 官方公共 rsync；s1 节点 IPv6(-6) 连接超时、默认模式实测单流 260–665KB/s，完整 dry-run 40s（19,441 文件 / 122.53G，0 新增，0 删除，仅同步 11B trace）。
  - url: rsync://rsync.mirrors.ustc.edu.cn/videolan-ftp/
    surveyed_at: '2026-10-03'
    status: retired-seed
    note: USTC 初始化种子；2026-11-22 已迁移至官方源。
  verification:
    surveyed_at: '2026-11-22'
    checks:
    - 2026-11-22 在 s1.mirrors.zjusct.io 对只读挂载的 videolan-ftp-sync（106G 已用 / 151G 可用）执行 dry-run 耗时 40s 退出 0：19,441 文件 / 122.53G，0 新增、0 删除。
