metadata:
  name: mysql
info:
  description: MySQL 数据库的官方软件包仓库
  upstream: https://repo.mysql.com/ # MySQL 官方 HTTPS 仓库（Akamai NetStorage）
sync:
  type: tsumugu
  interval: 6h
  timeout: 48h
  nodeSelector:
    kubernetes.io/hostname: s1.mirrors.zjusct.io
  tsumugu:
    parser: nginx
    threads: 12
    extra_args:
      # Akamai NetStorage 目录页会在约 2000 项处截断（如 mysql-cluster-8.0 截断 8.0.50），且部分目录列表缓存陈旧（如 8.4.13），
      # 启用 APT/YUM 元数据扩展解析 Packages 与 repodata，补齐缺失包并避免误删上游实际存在的版本。
      - --apt-packages
      - --yum-packages
storage:
  size: 5Ti
publish:
  http:
    tier: small
    replicas: 1
comment:
  official:
    surveyed_at: '2026-11-21'
    docs:
    - https://repo.mysql.com/
    - https://dev.mysql.com/doc/mysql-yum-repo-quick-guide/en/
    - https://dev.mysql.com/doc/mysql-apt-repo-quick-guide/en/
    policy:
    - 完整镜像 https://repo.mysql.com/ 全部内容（apt/、yum/、yumw/、GPG 密钥与安装包），保持 /mysql/ 发布路径，不改动签名元数据。
  upstreams:
  - url: https://repo.mysql.com/
    stack: dual
    surveyed_at: '2026-11-21'
    status: selected
    metrics: 's1 实测 IPv6 单流 10.1 MB/s、8 并发 121 MB/s；全树约 131,721 个对象 / 3.46 TiB'
    note: '官方 Akamai NetStorage HTTPS 源；实测 --parser nginx 可解析但受目录截断与陈旧目录缓存影响，必须配合 --apt-packages --yum-packages（dry-run 误删从 629 降至仅 7 项废弃 yumw/mysql-tools-preview/suse）；存储已从 2316Gi 扩至 5Ti 容纳全量。'
  - url: rsync://rsync.mirrors.ustc.edu.cn/mysql-repo/
    surveyed_at: '2026-10-07'
    status: rejected
    note: '历史初始化源；USTC 版裁剪了 el/6、el/7、旧 fc/、debuginfo/ 与 apt/dists/，现已切回官方全量源。'
