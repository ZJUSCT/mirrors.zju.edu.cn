metadata:
  name: ius
info:
  description: IUS 企业 Linux 软件仓库退役说明
  upstream: rsync://origin.repo.ius.io/ius/
sync:
  type: rsync
  interval: 24h
  timeout: 72h
  ipv6: true
  nodeSelector:
    kubernetes.io/hostname: s1.mirrors.zjusct.io
storage:
  size: 4Gi
publish:
  http:
    tier: small
    replicas: 1
comment:
  official:
    surveyed_at: '2026-11-10'
    docs:
    - https://ius.io/
    - https://ius.io/faq
    - https://repo.ius.io/
    - https://vault.ius.io/
    policy:
    - IUS 官方首页明确项目自 2024 年起退役；FAQ 声明不再维护，历史包放在 IUS Vault，旧版 RHEL/CentOS 包不再获得安全更新。
    - FAQ 保留了官方原站 rsync://origin.repo.ius.io/ius/；本次 IPv4、IPv6 均可完整读取该模块，原站服务可用不代表项目恢复维护。
    - 当前官方 rsync 模块只有 114 字节的 index.txt，内容为退役提示和 https://vault.ius.io 链接，与本站已发布文件完全一致。
    - 本镜像保留现有退役说明入口，改为通过 IPv6 直接从官方原站同步，避免依赖 TUNA 当前失败的 rsync 模块。
    - Vault 的 el4/、el5/、el6/、el7/ 和签名密钥属于独立的历史软件包归档；当前同步范围不包含 Vault，不将退役说明入口标为完整 RPM 镜像。
    - 未找到当前有效的官方同步间隔；24h 为本站定期检查原站退役说明的策略。
  upstreams:
  - url: rsync://origin.repo.ius.io/ius/
    stack: dual
    status: selected
    surveyed_at: '2026-11-10'
    validated_at: '2026-11-10'
    validation: 从同步节点分别使用 IPv4、IPv6 将完整模块读入临时目录，rsync 均退出 0；唯一文件 index.txt 为 114 字节，SHA-256 与本站已发布文件一致。
    sha256: 1cf97a422d05dd376075624375ade28e5e7dc0a7624c87500c393d748e2fd9cc
    note: 官方 FAQ 列出的原站；当前仅保留退役说明，使用 IPv6 同步。
  - url: rsync://mirrors.tuna.tsinghua.edu.cn/ius/
    stack: dual
    status: previous
    surveyed_at: '2026-11-10'
    note: 同步及 IPv6 只读探测均报 didn't get server startup line（rsync code 5），改为直连官方原站。
  - url: https://vault.ius.io/
    stack: ipv4
    status: reference
    surveyed_at: '2026-11-10'
    note: 官方 HTTPS 历史归档，根目录 IPv4 访问成功；与当前退役说明入口范围不同，本配置不镜像该归档。
