metadata:
  name: deepin
info:
  description: deepin 操作系统软件包仓库
  upstream: rsync://rsync.deepin.com/deepin/ # deepin 官方指定的软件包镜像同步入口
sync:
  type: rsync
  interval: 24h
  timeout: 24h
storage:
  size: 2Ti
  volumeName: pvc-95c111d7-ab04-46d4-bbfd-4f7686a1bda5
publish:
  http:
    tier: standard
    replicas: 1
comment:
  official:
    surveyed_at: 2026-09-18
    docs:
      - https://www.deepin.org/
      - https://www.deepin.org/en/mirrors/
    policy:
      - deepin 软件包镜像应从 rsync.deepin.com::deepin 同步，并通过每日定时任务保持更新。
      - 同时维护软件包与 ISO 镜像时，官方建议先同步软件包仓库，再同步 ISO 仓库。
      - 镜像目录中不应存放非官方软件包等其他文件，以免引起误解。
  upstreams:
    - url: rsync://rsync.deepin.com/deepin/
      stack: dual
      surveyed_at: 2026-09-18
      metrics: RTT 约 50–70ms、单文件约 1–3MB/s
      note: deepin 官方匿名 rsync 主站；deepin 模块标注为 LinuxDeepin Packages。
