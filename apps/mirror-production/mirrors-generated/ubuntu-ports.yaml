apiVersion: mirrors.zjusct.io/v1alpha1
kind: Mirror
metadata:
  name: ubuntu-ports
  namespace: mirror-production
  labels:
    app.kubernetes.io/name: falcon
spec:
  info:
    description: Ubuntu 非 x86 架构软件包仓库
    upstream: rsync://rsync.ports.ubuntu.com/ubuntu-ports/
  sync:
    interval: 6h
    retryInterval: 15m
    timeout: 6h
    failureRetryLimit: 3
    keepJobs: 1
    podTemplate:
      spec:
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          seccompProfile:
            type: RuntimeDefault
        initContainers:
          # 只初始化同步卷根目录的 owner；QFM 使用独立的同步 UID。
          - name: init-sync-volume
            image: busybox:1.37
            imagePullPolicy: Always
            command: [sh, /init/init-sync-volume.sh]
            env:
              - name: SYNC_UID
                value: "65532"
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
                add: [CHOWN]
            volumeMounts:
              - name: sync-data
                mountPath: /data
              - name: sync-volume-init
                mountPath: /init
                readOnly: true
            resources:
              requests: {cpu: 10m, memory: 16Mi}
              limits: {cpu: 100m, memory: 32Mi}
          # ftpsync 被异常终止时可能残留 AUIP 标记，需清理
          - name: clear-lock
            image: busybox:1.37
            imagePullPolicy: Always
            command: [rm, -f, /data/Archive-Update-in-Progress-mirrors.zju.edu.cn]
            volumeMounts:
              - name: sync-data
                mountPath: /data
        containers:
          - name: ftpsync
            image: ghcr.io/zjusct/archvsync:latest
            imagePullPolicy: Always
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
              readOnlyRootFilesystem: true
            command: [ftpsync]
            args: [sync:archive:ubuntu-ports]
            env:
              - name: LOGNAME
                value: falcon
              - name: HOME
                value: /data
              - name: TMPDIR
                value: /data/.ftpsync/tmp
              # 镜像差异变量经环境变量注入;站点级常量在共享的 configs/ftpsync.conf
              # (ftpsync source 该文件在 env 之后,故常量不得与其重名)
              - name: RSYNC_HOST
                value: rsync.ports.ubuntu.com
              - name: RSYNC_PATH
                value: ubuntu-ports
              - name: RSYNC_EXTRA
                value: "-6"
            volumeMounts:
              - name: tmp
                mountPath: /tmp
              - name: sync-data
                mountPath: /data
              # subPath 决定 read_config 要找的文件名(ftpsync-<archive>.conf),
              # 源文件是共享 ConfigMap ftpsync-conf 里的 ftpsync.conf
              - name: ftpsync-config
                mountPath: /etc/ftpsync/ftpsync-ubuntu-ports.conf
                subPath: ftpsync.conf
                readOnly: true
            resources:
              requests: {cpu: 500m, memory: 512Mi}
              limits: {cpu: "4", memory: 4Gi}
        volumes:
          - name: sync-volume-init
            configMap:
              name: sync-volume-init
          - name: tmp
            emptyDir: {}
          - name: ftpsync-config
            configMap:
              name: ftpsync-conf
  storage:
    syncStorageClassName: zfs-hdd-retain-wffc
    publishStorageClassName: zfs-hdd-delete-immediate
    pvcTemplate:
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 7Ti
      volumeMode: Filesystem
      volumeName: pvc-2d5a6c95-6946-489a-8969-ed35e16cb363
    volumeSnapshotClassName: openebs-zfs-snapshot
    retention: 1
  publish:
    http:
      replicas: 2
      podTemplate:
        metadata:
          annotations:
            reloader.stakater.com/auto: "true"
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: nginx
              image: nginxinc/nginx-unprivileged:mainline-alpine-otel
              imagePullPolicy: Always
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
                readOnlyRootFilesystem: true
              ports:
                - containerPort: 8080
                  name: http
              startupProbe:
                httpGet:
                  path: /healthz
                  port: http
                periodSeconds: 2
                timeoutSeconds: 2
                failureThreshold: 30
              readinessProbe:
                httpGet:
                  path: /healthz
                  port: http
                periodSeconds: 5
                timeoutSeconds: 2
                failureThreshold: 3
              livenessProbe:
                httpGet:
                  path: /healthz
                  port: http
                periodSeconds: 10
                timeoutSeconds: 2
                failureThreshold: 6
              resources:
                requests: {cpu: "10m", memory: 32Mi}
                limits: {cpu: "4", memory: 2Gi}
              volumeMounts:
                - name: nginx-conf
                  mountPath: /etc/nginx/nginx.conf
                  subPath: nginx.conf
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
                - name: mirror-data
                  mountPath: /usr/share/nginx/html/ubuntu-ports
                  readOnly: true
          volumes:
            - name: nginx-conf
              configMap:
                name: nginx-conf
            - name: tmp
              # 目录缓存上限 512Mi，额外空间用于正在填充的响应及其他临时文件。
              emptyDir:
                sizeLimit: 1Gi
