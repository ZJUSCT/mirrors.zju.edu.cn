apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mirror-production
resources:
  - deployment.yaml
  - service.yaml
  - httproute.yaml
configMapGenerator:
  # nginx 主配置，完整替换镜像默认配置（临时目录指向 /tmp）
  - name: mirror-delivery-nginx-conf
    options:
      disableNameSuffixHash: true
      labels:
        app.kubernetes.io/name: mirror-delivery
    files:
      - nginx.conf=nginx.conf
  # 单次「投递」对应一个子目录和一个 ConfigMap。ConfigMap 的 data 总量
  # 上限为 1 MiB，math-pi-day-2026 当前约 91 KiB；超限时按活动拆分或改用
  # 独立镜像（见本目录 README）。
  - name: mirror-delivery-math-pi-day-2026
    options:
      disableNameSuffixHash: true
      labels:
        app.kubernetes.io/name: mirror-delivery
    files:
      - game1.html=math-pi-day-2026/game1.html
      - game2.html=math-pi-day-2026/game2.html
      - game3.html=math-pi-day-2026/game3.html
