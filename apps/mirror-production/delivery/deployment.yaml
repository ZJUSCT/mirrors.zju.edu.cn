apiVersion: apps/v1
kind: Deployment
metadata:
  name: mirror-delivery
  namespace: mirror-production
  labels:
    app.kubernetes.io/name: mirror-delivery
    app.kubernetes.io/component: delivery-http
  annotations:
    # 页面内容与 nginx 配置均在 ConfigMap 中，名称固定（无哈希后缀），
    # 由 Reloader 在 ConfigMap 变更时触发滚动更新。
    reloader.stakater.com/auto: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mirror-delivery
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mirror-delivery
        app.kubernetes.io/component: delivery-http
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: zjusct.io/pool
                    operator: In
                    values: [frontend]
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: mirror-delivery
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:mainline-alpine-otel
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /delivery/math-pi-day-2026/game1.html
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /delivery/math-pi-day-2026/game1.html
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: "4", memory: 256Mi}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: content-math-pi-day-2026
              mountPath: /usr/share/nginx/html/delivery/math-pi-day-2026
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
        - name: nginx-conf
          configMap:
            name: mirror-delivery-nginx-conf
        - name: content-math-pi-day-2026
          configMap:
            name: mirror-delivery-math-pi-day-2026
