# 静态投递服务：只服务 ConfigMap 挂载的活动页面，不挂载镜像数据卷。
# 与共享 configs/nginx.conf 相同的约束：worker 数固定为 2，临时目录指向 /tmp，
# 以兼容 readOnlyRootFilesystem。
worker_processes  2;

error_log  /var/log/nginx/error.log notice;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # 活动页面为单文件 HTML（内联样式与脚本），压缩收益明显。
    # text/html 由 gzip 模块隐式包含，无需列出。
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;

        root /usr/share/nginx/html;
        charset utf-8;

        # 目录补斜杠使用相对重定向，避免向公网泄漏容器端口。
        absolute_redirect off;
        log_not_found off;

        # 与镜像域名的 HTTP 服务约定一致，不通过 CSP 强制浏览器升级 HTTPS。
        # 页面资源全部内联；字体来自 Google Fonts，game1 的成绩提交到
        # 活动方的排行榜 API（页面内的 LEADERBOARD_API）。
        # 注意：location 内一旦使用 add_header 便不再继承 server 级头，
        # 因此所有响应头集中在 server 级声明，location 内不得新增。
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://2026-pi-day.math.haoxx.me; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;

        # 活动期间可能热更新页面，要求浏览器每次协商验证；304 响应成本很低。
        add_header Cache-Control "no-cache" always;

        # 容器健康检查
        location = /healthz {
            access_log off;
            return 204;
        }

        # 页面文件直接命中；目录请求对脚本类客户端返回 autoindex JSON，
        # 与镜像发布源的目录契约保持一致（本服务不提供前端浏览壳）。
        location / {
            autoindex on;
            autoindex_format json;
            try_files $uri $uri/ =404;
        }
    }
}
