apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-config
  namespace: clickhouse
  labels:
    app.kubernetes.io/name: clickhouse
data:
  config.xml: |
    <clickhouse>
      <listen_host>::</listen_host>
      <max_connections>4096</max_connections>
      <keep_alive_timeout>64</keep_alive_timeout>
      <max_concurrent_queries>100</max_concurrent_queries>
      <prometheus>
        <endpoint>/metrics</endpoint>
        <port>9363</port>
        <metrics>true</metrics>
        <events>true</events>
        <asynchronous_metrics>true</asynchronous_metrics>
        <status_info>true</status_info>
      </prometheus>
      <query_log>
        <flush_interval_milliseconds>5000</flush_interval_milliseconds>
      </query_log>
    </clickhouse>
  users.xml: |
    <clickhouse>
      <users>
        <default>
          <password from_env="CLICKHOUSE_PASSWORD"/>
        </default>
        <app>
          <!-- Grafana 数据源（只读） -->
          <password_sha256_hex>d962503a77d25a6ee9231ed156320a6a157033006acc1f8b9af67ee1574e7426</password_sha256_hex>
          <profile>default</profile>
          <networks>
            <ip>172.26.0.0/16</ip>
            <ip>172.27.0.0/16</ip>
          </networks>
          <grants>
            <query>GRANT SHOW ON *.*</query>
            <query>GRANT SELECT ON system.*</query>
            <query>GRANT SELECT ON otel.*</query>
          </grants>
        </app>
        <otelcollector>
          <!-- 自有 OTel collector 的 clickhouseexporter 写入用户 -->
          <password_sha256_hex>78900d73d69748d7c28f2d9474741cbabafaa06d3e2fa56cff862c8ddb702199</password_sha256_hex>
          <profile>default</profile>
          <networks>
            <ip>172.26.0.0/16</ip>
            <ip>172.27.0.0/16</ip>
          </networks>
          <grants>
            <!-- create_schema=true 时自建 otel 库表，权限限定在 otel 库。 -->
            <query>GRANT SELECT,INSERT,CREATE,SHOW ON otel.*</query>
          </grants>
        </otelcollector>
      </users>
    </clickhouse>
