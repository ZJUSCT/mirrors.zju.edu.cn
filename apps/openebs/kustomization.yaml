apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openebs
resources:
  - resources/namespace.yaml
  - resources/storageclasses.yaml
  - resources/volumesnapshotclass.yaml
helmCharts:
  - name: zfs-localpv
    repo: https://openebs.github.io/zfs-localpv
    releaseName: openebs-zfs-localpv
    namespace: openebs
    valuesFile: values/zfs-localpv-2.11.0.yaml
    version: 2.11.0
    includeCRDs: true
