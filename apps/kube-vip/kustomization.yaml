apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kube-vip
resources:
  - resources/namespace.yaml
helmCharts:
  - name: kube-vip
    # currently no oci chart: https://github.com/kube-vip/helm-charts/issues/67
    repo: https://kube-vip.github.io/helm-charts
    includeCRDs: true
    releaseName: kube-vip
    namespace: kube-vip
    valuesFile: values/kube-vip-0.11.1.yaml
    version: 0.11.1
