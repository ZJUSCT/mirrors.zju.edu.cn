# Harbor declarative configuration
# Applied by configure_harbor.py via Harbor REST API (v2.0)

# --- System Settings (PUT /api/v2.0/configurations) ---
# Only listed keys will be updated; omitted keys are left untouched.
system:
  auth_mode: db_auth
  self_registration: false
  project_creation_restriction: adminonly

# --- Registry Endpoints (POST /api/v2.0/registries) ---
# type: docker-hub, github-ghcr, docker-registry, harbor, quay, ...
registries:
  - name: hub.docker.com
    type: docker-hub
    url: https://hub.docker.com

  - name: ghcr.io
    type: github-ghcr
    url: https://ghcr.io

  - name: quay.io
    type: docker-registry
    url: https://quay.io

  - name: nvcr.io
    type: docker-registry
    url: https://nvcr.io

  - name: registry.k8s.io
    type: docker-registry
    url: https://registry.k8s.io

  - name: registry.gitlab.com
    type: docker-registry
    url: https://registry.gitlab.com

  - name: public.ecr.aws
    type: docker-registry
    url: https://public.ecr.aws

  - name: mcr.microsoft.com
    type: docker-registry
    url: https://mcr.microsoft.com

  - name: docker.elastic.co
    type: docker-registry
    url: https://docker.elastic.co

  - name: gcr.io
    type: docker-registry
    url: https://gcr.io

  - name: k8s.gcr.io
    type: docker-registry
    url: https://k8s.gcr.io

  - name: us.gcr.io
    type: docker-registry
    url: https://us.gcr.io

  - name: lscr.io
    type: docker-registry
    url: https://lscr.io

  - name: docker.osgeo.org
    type: docker-registry
    url: https://docker.osgeo.org

# --- Projects (POST /api/v2.0/projects) ---
# For proxy cache projects, set registry to the name of a registry endpoint
# above. Regular projects omit the registry field.
projects:
  - name: hub.docker.com
    public: true
    registry: hub.docker.com
    metadata:
      max_upstream_conn: 1
  - name: docker.io
    public: true
    registry: hub.docker.com
    metadata:
      max_upstream_conn: 1
