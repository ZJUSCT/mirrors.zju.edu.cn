apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: harbor-portal
  namespace: harbor
spec:
  parentRefs:
    - name: envoy-gateway-staging
      namespace: envoy-gateway
      sectionName: https
  hostnames:
    - harbor.mirrors.zjusct.io
  rules:
    # 只将 Web UI 所需的公开 API 和登录路径交给 core。
    # 不暴露 /api/internal、/v2 或 /service/token，避免绕过 registry-gate。
    - matches:
        - path:
            type: PathPrefix
            value: /api/v2.0
        - path:
            type: Exact
            value: /api/version
        - path:
            type: PathPrefix
            value: /c
      backendRefs:
        - name: harbor-core
          port: 80
    # 静态资源和前端路由直接访问 portal，不经过同时开放 Registry API
    # 的 harbor（nginx）Service。未匹配上方规则的路径只会得到静态页面。
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: harbor-portal
          port: 80
