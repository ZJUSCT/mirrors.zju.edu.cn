# registry-gate chart defaults (generic skeleton).
#
# The gate deploys next to a harbor chart in the SAME namespace and owns
# the public mirror hostname's auth surfaces; raw /v2/* traffic goes to
# Harbor through the same HTTPRoute:
#
#   /service/token, /v2, /v2/  -> registry-gate (token endpoint + probe)
#   /token, /admin             -> registry-gate (portal + admin UI)
#   /v2/*                      -> harbor frontend (manifests, blobs)
#   anything else              -> 404 (Harbor portal/API stay private)
#
# Harbor keeps its default externalURL: the token realm it advertises is
# built from the REQUEST Host header (scheme only comes from externalURL).
#
# Deployment-specific values (hostname, parentRefs, SSO, whitelist, ...)
# belong in the environment's values file, not here.

image:
  repository: ghcr.io/zjusct/registry-gate
  # defaults to the chart appVersion
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1

# Public hostname of the mirror: HTTPRoute hostname, the gate's
# external_url, and what users "docker login" against. Required.
hostname: registry.mirrors.zjusct.io

# Docker Hub mirror for daemon.json / hosts.toml clients.
# Both entry points share the existing hub.docker.com Harbor project.
dockerhubMirror:
  hostname: docker.mirrors.zjusct.io
  project: hub.docker.com

route:
  enabled: true
  # Required when enabled, e.g.
  #   - name: envoy-gateway
  #     namespace: envoy-gateway
  #     sectionName: https
  #     group: gateway.networking.k8s.io
  #     kind: Gateway
  parentRefs:
    - name: envoy-gateway-staging
      namespace: envoy-gateway
      sectionName: https
      group: gateway.networking.k8s.io
      kind: Gateway
  # Harbor service receiving /v2/* traffic. With the harbor helm chart
  # and expose.type: ingress this is the core service (harbor-core); the
  # chart creates no unified frontend service in that mode.
  harborBackend:
    name: harbor-core
    port: 80

harbor:
  # In-cluster base URL the gate forwards allowed token requests to
  # (the harbor chart's core service, e.g. http://harbor-core). Required.
  baseUrl: http://harbor-core

gate:
  anonymous:
    enabled: true
  denyMessage: "Image not in the anonymous pull whitelist. Visit {portal_url} to sign in and get an access token, then run: docker login {external_url}"
  loginFailedMessage: "Invalid or expired access token. Visit {portal_url} to get a new one."

whitelist:
  # The whitelist content is NOT managed by this chart: embedding large
  # lists in values files makes chart upgrades diff badly. Provide an
  # existing ConfigMap (e.g. generated by kustomize configMapGenerator);
  # it is directory-mounted at /etc/registry-gate/whitelist/ so changes
  # hot-reload without a restart.
  existingConfigMap: registry-gate-whitelist
  # Filenames (keys of that ConfigMap) to load, in order.
  # DaoCloud allows.txt format: host/path exact | host/path/* (exactly one
  # more segment) | host/path/** (recursive prefix). No tags.
  # Generated by the configMapGenerator in kustomization.yaml from
  # configs/: allows.txt is vendored from DaoCloud/public-image-mirror
  # (https://github.com/DaoCloud/public-image-mirror/blob/main/allows.txt),
  # extra.list holds our own audited additions.
  files:
    - allows.txt
    - extra.list
projects:
  # harbor project name -> whitelist upstream host (= first path segment
  # of allows.txt lines). Required non-empty. Also the "mirrored
  # upstreams" list: scopes whose project is not listed are rejected with
  # "upstream not mirrored".
  map:
    docker.io: docker.io
    hub.docker.com: docker.io
    registry-1.docker.io: docker.io
    ghcr.io: ghcr.io
    quay.io: quay.io
    nvcr.io: nvcr.io
    registry.k8s.io: registry.k8s.io
    registry.gitlab.com: registry.gitlab.com
    public.ecr.aws: public.ecr.aws
    mcr.microsoft.com: mcr.microsoft.com
    docker.elastic.co: docker.elastic.co
    gcr.io: gcr.io
    k8s.gcr.io: k8s.gcr.io
    us.gcr.io: us.gcr.io
    lscr.io: lscr.io
    docker.osgeo.org: docker.osgeo.org

auth:
  token:
    issuer: zju-mirror
    # the PAT signing key is auto-generated on first start and stored in
    # PostgreSQL - shared by every replica
    defaultTtl: 180d
    maxTtl: 365d

storage:
  # Used only when postgresql.enabled=false. Supply a DSN via envSecret.
  postgresDsn: "${GATE_DATABASE_DSN}"
  usageRetention: 90d

# Shared database for tokens, usage, signing keys and session secrets.
# Credentials must come from a stable Secret, including with GitOps rendering.
postgresql:
  enabled: true
  architecture: standalone
  # PostgreSQL 18.6: pin the upstream image so a gate rollout cannot pull
  # an unexpected database major version from Bitnami's mutable latest tag.
  image:
    digest: sha256:b74b23f091dcc87041bcae557d840c36458af46b955279cb13aedec4c32d7f71
  auth:
    enablePostgresUser: false
    username: registry_gate
    database: registry_gate
    existingSecret: registry-gate-postgresql
    secretKeys:
      userPasswordKey: password
  primary:
    persistence:
      enabled: true
      storageClass: ceph-block
      size: 8Gi
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi

portal:
  enabled: true
  basePath: /token
  oidc:
    issuer: "https://git.zju.edu.cn"
    clientId: "6a3557894c7a10a2b4fd2df56b43466303fee09bf4eeed659ffb7d5fa4a4f5fa"
    # the rendered config references ${GATE_GITLAB_CLIENT_SECRET}; supply
    # it through envSecret below
    scopes: ["openid"]
    # defaults to https://<hostname>/token/callback
    redirectUri: ""
  maxTokensPerUser: 10

admin:
  enabled: true
  basePath: /admin
  github:
    clientId: "Ov23liklCYcHsZIoija8"
    allowedUsers: []
    allowedOrgs: ["ZJUSCT"]

envSecret:
  # Existing secret (e.g. a SealedSecret) whose keys become environment
  # variables substituted into the config, e.g.
  # GATE_GITLAB_CLIENT_SECRET / GATE_GITHUB_CLIENT_SECRET.
  existingSecret: registry-gate-secrets

# Plaintext environment variables injected alongside the envFrom secret.
# For non-secret settings only (outbound HTTP(S)_PROXY, NO_PROXY, ...);
# anything credential-like belongs in the envSecret. The app honors
# HTTP(S)_PROXY / NO_PROXY via Go's net/http.
extraEnv:
  HTTP_PROXY: http://sing-box.sing-box.svc.cluster.local:7890
  HTTPS_PROXY: http://sing-box.sing-box.svc.cluster.local:7890
  NO_PROXY: "127.0.0.1,localhost,harbor-core,.local,.internal,::1,10.0.0.0/8,172.26.0.0/16,172.27.0.0/16,fda8:d4b1:99d0:100::/56,fda8:d4b1:99d0:200::/112,.svc,.cluster.local"

# CIDRs trusted to set X-Forwarded-For (the gateway data path); client
# IPs for rate limiting are taken from there.
trustedProxies:
  - 10.0.0.0/8
  - 172.26.0.0/16
  - 172.27.0.0/16


observability:
  otel_logs:
    # OTLP/HTTP export of the gate's structured logs (stdout output stays
    # on regardless). Fill the endpoint per environment.
    enabled: false
    endpoint: ""
    # headers: {}
    # timeout: 10s
    # batch:
    #   max_queue_size: 2048
    #   flush_interval: 1s
    service_name: registry-gate
    # service_version: ""                   # defaults to the image's build version

podAnnotations:
  reloader.stakater.com/auto: "true"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: "1"
    memory: 256Mi
