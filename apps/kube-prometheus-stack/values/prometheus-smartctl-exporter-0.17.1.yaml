config:
  # Monitor every physical SCSI/SATA disk exposed by the storage nodes. /dev/sdak
  # is the system RAID logical device and is intentionally excluded.
  device_include: '^/dev/sd([a-z]|a[a-j])$'
#  devices:
#  - /dev/sda
#  device_include: /dev/sd.*
#  device_exclude: /dev/sr.*

extraInstances: []
# - config:
#     devices:
#     - /dev/nvme0n1
#   nodeSelector:
#     type: other

common:
  config:
    bind_to: "0.0.0.0:9633"
    url_path: "/metrics"
    smartctl_location: /usr/sbin/smartctl
    collect_not_more_than_period: 120s

extraArgs:
  # Add extra arguments to the smartctl exporter
  # Do not wake an idle disk solely for a monitoring scrape.
  smartctl.powermode-check: standby

serviceMonitor:
  enabled: true
  # Specify namespace to load the monitor if not in the same namespace
  # namespace: prometheus-operator
  # Add Extra labels if needed. Prometeus operator may need them to find it.
  extraLabels: {}
  # release: prometheus-operator
  interval: 30s
  scrapeTimeout: 30s
  # Set relabel_configs as per https://prometheus.io/docs/prometheus/latest/configuration/configuration/#relabel_config
  relabelings:
    - sourceLabels: [__meta_kubernetes_pod_node_name]
      targetLabel: node
  metricRelabelings: []
  ## Attach node metadata to discovered targets. Requires Prometheus v2.35.0 and above.
  attachMetadata:
    node: true

prometheusRules:
  enabled: true
  # Specify namespace to load the rule if not in the same namespace
  # namespace: prometheus-operator
  # Add Extra labels if needed. Prometeus operator may need them to find it.
  extraLabels: {}
  # release: prometheus-operator
  rules:
    smartCTLDeviceMediaErrors:
      enabled: true
      alert: SmartCTLDeviceMediaErrors
      expr: smartctl_device_media_errors != 0
      for: 1m
      annotations:
        summary: Device has media errors
        description: Device {{ $labels.device }} on instance {{ $labels.instance }} has media errors
      labels:
        severity: critical
    smartCTLDeviceCriticalWarning:
      enabled: true
      alert: SmartCTLDeviceCriticalWarning
      expr: smartctl_device_critical_warning != 0
      for: 1m
      annotations:
        summary: Device has critical controller warnings
        description: Device {{ $labels.device }} on instance {{ $labels.instance }} has critical controller warnings
      labels:
        severity: critical
    smartCTLDeviceAvailableSpareUnderThreshold:
      enabled: true
      alert: SmartCTLDeviceAvailableSpareUnderThreshold
      expr: smartctl_device_available_spare_threshold > smartctl_device_available_spare
      for: 1m
      annotations:
        summary: Device is under available spare threshold
        description: Device {{ $labels.device }} on instance {{ $labels.instance }} is under available spare threshold
      labels:
        severity: warning
    smartCTLDeviceStatus:
      enabled: true
      alert: SmartCTLDeviceStatus
      expr: smartctl_device_smart_status != 1
      for: 2m
      annotations:
        summary: SMART reports a failed device
        description: Device {{ $labels.device }} ({{ $labels.serial_number }}) on {{ $labels.node }} reports a failed SMART status.
      labels:
        severity: critical
    smartCTLDInterfaceSlow:
      enabled: true
      alert: SmartCTLDInterfaceSlow
      expr: smartctl_device_interface_speed{speed_type="current"} != on(device, instance, namespace, pod) smartctl_device_interface_speed{speed_type="max"}
      for: 1m
      annotations:
        summary: Device interface is slower then it should be
        description: Device {{ $labels.device }} on instance {{ $labels.instance }} interface is slower then it should be
      labels:
        severity: warning
    smartCTLDDeviceTemperature:
      enabled: true
      alert: SmartCTLDDeviceTemperature
      expr: smartctl_device_temperature{temperature_type="current"} > 60
      for: 1m
      annotations:
        summary: Device has temperature higher than 60°C
        description: Device {{ $labels.device }} on instance {{ $labels.instance }} has temperature higher than 60°C
      labels:
        severity: warning
    smartCTLPendingSectors:
      enabled: true
      alert: SmartCTLPendingSectors
      expr: 'smartctl_device_attribute{attribute_id="197",attribute_value_type="raw"} > 0'
      for: 5m
      annotations:
        summary: Disk has pending sectors
        description: Device {{ $labels.device }} on {{ $labels.node }} reports {{ $value }} pending sectors.
      labels:
        severity: warning
    smartCTLUncorrectableSectors:
      enabled: true
      alert: SmartCTLUncorrectableSectors
      expr: 'smartctl_device_attribute{attribute_id="198",attribute_value_type="raw"} > 0'
      for: 5m
      annotations:
        summary: Disk has offline uncorrectable sectors
        description: Device {{ $labels.device }} on {{ $labels.node }} reports {{ $value }} offline uncorrectable sectors.
      labels:
        severity: critical
    micron5200FirmwareRollover:
      enabled: true
      alert: Micron5200FirmwareRollover
      expr: '(smartctl_device_power_on_seconds >= 235926000) * on (device, instance, namespace, pod) group_left(model_name, serial_number, firmware_version) smartctl_device{model_name="Micron_5200_MTFDDAK480TDC",firmware_version!="D1MU040"}'
      for: 2m
      annotations:
        summary: Micron 5200 has crossed the affected firmware hour boundary
        description: Device {{ $labels.device }} ({{ $labels.serial_number }}) on {{ $labels.node }} has crossed 65,535 power-on hours while running {{ $labels.firmware_version }}.
      labels:
        severity: critical
    micron5200LifetimeWarning:
      enabled: true
      alert: Micron5200LifetimeWarning
      expr: '((smartctl_device_attribute{attribute_id="202",attribute_value_type="value"} >= 10) and (smartctl_device_attribute{attribute_id="202",attribute_value_type="value"} < 80)) * on (device, instance, namespace, pod) group_left(model_name, serial_number, firmware_version) smartctl_device{model_name="Micron_5200_MTFDDAK480TDC"}'
      for: 10m
      annotations:
        summary: Micron 5200 lifetime is below 80 percent
        description: Device {{ $labels.device }} ({{ $labels.serial_number }}) on {{ $labels.node }} reports {{ $value }} percent lifetime remaining.
      labels:
        severity: warning
    micron5200LifetimeCritical:
      enabled: true
      alert: Micron5200LifetimeCritical
      expr: '(smartctl_device_attribute{attribute_id="202",attribute_value_type="value"} < 10) * on (device, instance, namespace, pod) group_left(model_name, serial_number, firmware_version) smartctl_device{model_name="Micron_5200_MTFDDAK480TDC"}'
      for: 2m
      annotations:
        summary: Micron 5200 lifetime is critically low
        description: Device {{ $labels.device }} ({{ $labels.serial_number }}) on {{ $labels.node }} reports {{ $value }} percent lifetime remaining.
      labels:
        severity: critical
    micron5200TBWWarning:
      enabled: true
      alert: Micron5200TBWWarning
      expr: '(((smartctl_device_attribute{attribute_id="246",attribute_value_type="raw"} * 512 / 1e12) >= 696) and ((smartctl_device_attribute{attribute_id="246",attribute_value_type="raw"} * 512 / 1e12) < 870)) * on (device, instance, namespace, pod) group_left(model_name, serial_number, firmware_version) smartctl_device{model_name="Micron_5200_MTFDDAK480TDC"}'
      for: 10m
      annotations:
        summary: Micron 5200 has consumed at least 80 percent of rated TBW
        description: Device {{ $labels.device }} ({{ $labels.serial_number }}) on {{ $labels.node }} has approximately {{ $value }} TB of host writes.
      labels:
        severity: warning
    micron5200TBWCritical:
      enabled: true
      alert: Micron5200TBWCritical
      expr: '((smartctl_device_attribute{attribute_id="246",attribute_value_type="raw"} * 512 / 1e12) >= 870) * on (device, instance, namespace, pod) group_left(model_name, serial_number, firmware_version) smartctl_device{model_name="Micron_5200_MTFDDAK480TDC"}'
      for: 2m
      annotations:
        summary: Micron 5200 has exceeded its rated TBW
        description: Device {{ $labels.device }} ({{ $labels.serial_number }}) on {{ $labels.node }} has approximately {{ $value }} TB of host writes.
      labels:
        severity: critical

image:
  repository: quay.io/prometheuscommunity/smartctl-exporter
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

updateStrategy:
  rollingUpdate:
    maxUnavailable: 1
  type: RollingUpdate

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

rbac:
  create: false
  podSecurityPolicy: unrestricted-psp

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    memory: 128Mi
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #  cpu: 100m
  #  memory: 128Mi
  # requests:
  #  cpu: 100m
  #  memory: 128Mi

hostNetwork: false

priorityClassName: ""

annotations: {}

# Additional annotations to add to the exporter pods.
podAnnotations: {}

# Additional labels to add to the exporter pods.
podLabels: {}

nodeSelector: {}

tolerations:
  - effect: NoSchedule
    operator: Exists

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - s1.mirrors.zjusct.io
                - s2.mirrors.zjusct.io
                - s3.mirrors.zjusct.io

service:
  type: ClusterIP
  port: 80
  ipDualStack:
    enabled: false
    ipFamilies: ["IPv6", "IPv4"]
    ipFamilyPolicy: "PreferDualStack"
