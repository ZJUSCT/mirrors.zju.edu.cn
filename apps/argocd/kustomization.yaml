apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - resources/namespace.yaml
  - resources/sealedsecret-argocd.yaml
  - resources/sealedsecret-repo.yaml
  - resources/referencegrant.yaml
  - resources/apps.yaml
helmCharts:
  - name: argo-cd
    repo: oci://ghcr.io/argoproj/argo-helm
    includeCRDs: true
    releaseName: argo-cd
    namespace: argocd
    valuesFile: values/argo-cd-10.11.1.yaml
    version: 10.11.1
