kind: SealedSecret
apiVersion: bitnami.com/v1alpha1
metadata:
  name: argocd-repo-mirror-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  template:
    metadata:
      name: argocd-repo-mirror-config
      namespace: argocd
      labels:
        argocd.argoproj.io/secret-type: repository
    type: Opaque
    data:
      name: mirror-config
      type: git
      url: git@github.com:ZJUSCT/mirror-config.git
  encryptedData:
    sshPrivateKey: 
---
kind: SealedSecret
apiVersion: bitnami.com/v1alpha1
metadata:
  name: argocd-repo-mirrors
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  template:
    metadata:
      name: argocd-repo-mirrors
      namespace: argocd
      labels:
        argocd.argoproj.io/secret-type: repository
    type: Opaque
    data:
      name: mirrors.zju.edu.cn
      type: git
      url: git@github.com:ZJUSCT/mirrors.zju.edu.cn.git
  encryptedData:
    sshPrivateKey: 
