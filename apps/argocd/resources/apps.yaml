apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: default
spec:
  sourceRepos:
    - "*"
  destinations:
    - namespace: "*"
      server: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  sourceNamespaces:
    - "*"
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: mirror-config
spec:
  # Allow temporarily toggling auto-sync for maintenance
  # https://argo-cd.readthedocs.io/en/stable/operator-manual/applicationset/Controlling-Resource-Modification/#allow-temporarily-toggling-auto-sync
  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/syncPolicy
  generators:
    - git:
        repoURL: git@github.com:ZJUSCT/mirror-config.git
        revision: main
        requeueAfterSeconds: 120
        directories:
          - path: argocd/*
        values:
          repoURL: git@github.com:ZJUSCT/mirror-config.git
    - git:
        repoURL: git@github.com:ZJUSCT/mirrors.zju.edu.cn.git
        revision: main
        requeueAfterSeconds: 120
        directories:
          - path: apps/argocd
          - path: apps/cert-manager
          - path: apps/clickhouse
          - path: apps/envoy-gateway
          - path: apps/external-dns
          - path: apps/harbor
          - path: apps/headlamp
          - path: apps/kube-prometheus-stack
          - path: apps/kube-system
          - path: apps/kube-vip
          - path: apps/mirror-production
          - path: apps/openebs
          - path: apps/opentelemetry
          - path: apps/reloader
          - path: apps/rook-ceph
        values:
          repoURL: git@github.com:ZJUSCT/mirrors.zju.edu.cn.git
  template:
    metadata:
      name: "{{path.basename}}"
      namespace: "{{path.basename}}"
      annotations:
        argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true
    spec:
      project: default
      source:
        repoURL: "{{values.repoURL}}"
        targetRevision: main
        path: "{{path}}"
      destination:
        name: in-cluster
        namespace: "{{path.basename}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
