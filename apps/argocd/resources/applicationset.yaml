apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: mirrors
spec:
  # Allow temporarily pausing an Application without ignoring other sync settings.
  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/syncPolicy/automated/enabled
  generators:
    - git:
        repoURL: git@github.com:ZJUSCT/mirrors.zju.edu.cn.git
        revision: main
        requeueAfterSeconds: 120
        directories:
          # apps/argocd is managed by the independent root Application.
          - path: apps/cert-manager
          - path: apps/clickhouse
          - path: apps/envoy-gateway
          - path: apps/external-dns
          - path: apps/harbor
          - path: apps/headlamp
          - path: apps/kube-prometheus-stack
          - path: apps/kube-system
          - path: apps/kube-vip
          - path: apps/mirror-production
          - path: apps/openebs
          - path: apps/opentelemetry
          - path: apps/reloader
          - path: apps/rook-ceph
  template:
    metadata:
      name: "{{path.basename}}"
      namespace: argocd
      annotations:
        argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true
    spec:
      project: default
      source:
        repoURL: git@github.com:ZJUSCT/mirrors.zju.edu.cn.git
        targetRevision: main
        path: "{{path}}"
      destination:
        name: in-cluster
        namespace: "{{path.basename}}"
      syncPolicy:
        automated:
          enabled: true
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
