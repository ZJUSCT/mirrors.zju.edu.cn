# ZJU Mirror patch over the upstream kairos-init GrubCfg template
# (kairos v4.3.0, kairos-init/pkg/bundled/bundled.go, GrubCfg const).
# Installed to COS_STATE/grub2/grub.cfg at install time and refreshed after
# upgrades by /system/oem/20_grub-boot-speedup.yaml. Changes:
#
#  1. Optional env/menu files are looked up directly on $root instead of via
#     "search --file". The ESP stub (EFI/ubuntu/grub.cfg) already anchors
#     $root and $prefix to the COS_STATE filesystem before this file is
#     sourced, while every search scans all EFI-visible disks - twice when
#     it fails, see grub grub-core/commands/search.c. On nodes whose RAID
#     controllers pass dozens of data disks through to EFI, the stock scans
#     cost minutes of synchronous BlockIO reads before the menu appears.
#  2. The COS_STATE "search --label" calls in the default and fallback
#     menu entries carry --hint=$root so the common path resolves without a
#     device scan. Recovery entries keep the stock scans (they only run in
#     manual recovery / reset scenarios).
#  3. The boot assessment is INLINED below, anchored to $root, and the
#     stock tail that sources COS_STATE:/grubcustom (which itself sources
#     grub_boot_assessment with two more device-wide searches) is dropped.
#     This makes the config self-contained: the first boot after a fresh
#     install or upgrade is already fast, and kairos-init regenerating its
#     boot-assessment files from the stock template is harmless because we
#     never read them. The inlined logic is a verbatim copy of the
#     boot-assessment script in kairos-init's 08_grub.yaml with the device
#     lookups replaced by "(${root})" (v0.3.2; previously this was patched
#     after install/upgrade by sed, which lost a race against 08_grub's
#     rewrite: yip executes stage steps within a hook in non-deterministic
#     order).
#  4. Dropped insmod/loadfont for files kairos does not ship in the state
#     partition module dir (all_video.mod, serial.mod, unicode.pf2); the
#     failed loads only printed errors.
#  5. Menu timeout 10s -> 3s.

set timeout=3

# set default values for kernel, initramfs
# Other files can still override this
set kernel=/boot/vmlinuz
set initramfs=/boot/initrd

# Load custom env file
set env_file="/grubenv"
set env_blk=""
if [ -e "(${root})${env_file}" ]; then
  set env_blk="${root}"
fi

# Load custom env file
set oem_env_file="/grub_oem_env"
set oem_blk=""
if [ -e "(${root})${oem_env_file}" ]; then
  set oem_blk="${root}"
fi

# Load custom menu branding
set custom_menu="/grubmenu"
set menu_blk=""
if [ -e "(${root})${custom_menu}" ]; then
  set menu_blk="${root}"
fi

if [ "${oem_blk}" ] ; then
  load_env -f "(${oem_blk})${oem_env_file}"
fi

if [ "${env_blk}" ] ; then
  load_env -f "(${env_blk})${env_file}"
fi

# Save default
if [ "${next_entry}" ]; then
  set default="${next_entry}"
  set selected_entry="${next_entry}"
  set next_entry=
  save_env -f "(${env_blk})${env_file}" next_entry
else
  set default="${saved_entry}"
fi

## Display a default menu entry if set
if [ "${default_menu_entry}" ]; then
  set display_name="${default_menu_entry}"
else
  set display_name="Kairos"
fi

## Set a default fallback if set
if [ "${default_fallback}" ]; then
  set fallback="${default_fallback}"
else
  set fallback="0 1 2"
fi

insmod loopback
insmod squash4

if [ "${grub_platform}" = "efi" ]; then
    ## workaround for grub2-efi bug: https://bugs.launchpad.net/ubuntu/+source/grub2/+bug/1851311
    rmmod tpm
fi

menuentry "${display_name}" --id cos {
  search --no-floppy --label --set=root --hint=$root COS_STATE
  set img=/cOS/active.img
  set label=COS_ACTIVE
  if [ -d (loop0) ]; then
    loopback -d loop0
  fi
  loopback loop0 /$img
  set root=($root)
  source (loop0)/etc/cos/bootargs.cfg
  linux (loop0)$kernel $kernelcmd ${extra_cmdline} ${extra_active_cmdline}
  initrd (loop0)$initramfs
}

menuentry "${display_name} (fallback)" --id fallback {
  search --no-floppy --label --set=root --hint=$root COS_STATE
  set img=/cOS/passive.img
  set label=COS_PASSIVE
  if [ -d (loop0) ]; then
    loopback -d loop0
  fi
  loopback loop0 /$img
  set root=($root)
  source (loop0)/etc/cos/bootargs.cfg
  linux (loop0)$kernel $kernelcmd ${extra_cmdline} ${extra_passive_cmdline}
  initrd (loop0)$initramfs
}

menuentry "${display_name} recovery" --id recovery {
  search --no-floppy --label --set=root COS_RECOVERY
  if [ test -s /cOS/recovery.squashfs ]; then
    set img=/cOS/recovery.squashfs
    set recoverylabel=COS_RECOVERY
  else
    set img=/cOS/recovery.img
  fi
  set label=COS_SYSTEM
  if [ -d (loop0) ]; then
    loopback -d loop0
  fi
  loopback loop0 /$img
  set root=($root)
  source (loop0)/etc/cos/bootargs.cfg
  linux (loop0)$kernel $kernelcmd ${extra_cmdline} ${extra_recovery_cmdline}
  initrd (loop0)$initramfs
}

menuentry "${display_name} state reset (auto)" --id statereset {
  search --no-floppy --label --set=root COS_RECOVERY
  if [ test -s /cOS/recovery.squashfs ]; then
    set img=/cOS/recovery.squashfs
    set recoverylabel=COS_RECOVERY
  else
    set img=/cOS/recovery.img
  fi
  set label=COS_SYSTEM
  if [ -d (loop0) ]; then
    loopback -d loop0
  fi
  loopback loop0 /$img
  set root=($root)
  source (loop0)/etc/cos/bootargs.cfg
  linux (loop0)$kernel $kernelcmd ${extra_cmdline} ${extra_recovery_cmdline} vga=795 nomodeset kairos.reset
  initrd (loop0)$initramfs
}

if [ "${menu_blk}" ]; then
  source "(${menu_blk})${custom_menu}"
fi

# Boot assessment: verbatim logic from kairos-init's 08_grub.yaml
# ("Add boot assessment grub configuration"), with the "search --file"
# device lookups replaced by the already-anchored $root.
if [ -e "(${root})/boot_assessment" ]; then
  load_env -f "(${root})/boot_assessment"
fi
if [ "${enable_boot_assessment}" = "yes" -o "${enable_boot_assessment_always}" = "yes" ]; then
  if [ -z "${selected_entry}" ]; then
    if [ "${boot_assessment_tentative}" = "yes" ]; then
      set default="fallback"
      set extra_passive_cmdline="upgrade_failure"
    else
      set boot_assessment_tentative="yes"
      save_env -f "(${root})/boot_assessment" boot_assessment_tentative
    fi
  fi
fi
